name: seed-quality

# Phase 1 of the seed-quality gate.
#
# Two jobs:
#   1. seed-static-check  — fast, no DB. Runs on every PR and push.
#   2. course-data-audit  — connects to Mongo. Runs on push to main and on
#                            manual dispatch. Skipped on PRs from forks
#                            where secrets aren't available.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed-static-check:
    name: Static check (seed scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run seed-script linter
        run: node tools/check-seed.cjs

  course-data-audit:
    name: Live audit (interactivecourses)
    runs-on: ubuntu-latest
    # Skip on PRs from forks: secrets are not exposed there.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The audit needs the mongodb driver. mongoose pulls it in transitively,
      # but a top-level install keeps the dependency explicit and fast.
      - name: Install mongodb driver
        run: npm install --no-save mongodb@6

      - name: Run live course audit
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MIN_WPCE:    ${{ vars.MIN_WPCE || '6000' }}
        run: node tools/audit-course-quality.cjs --allow-draft
