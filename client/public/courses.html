<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses - CounselorReady</title>
  <link rel="stylesheet" href="/css/design-tokens.css">
  <link rel="stylesheet" href="/css/typography.css">
  <script src="/js/tailwind-config.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <style>
    body{background:#F8F7F4; font-family: 'Lato', system-ui, sans-serif; }
    .font-display { font-family: 'Cormorant Garamond', Georgia, serif; }
  
    /* Shared nav styles */
    .dd{display:none;position:absolute;top:100%;margin-top:6px;background:#fff;border-radius:10px;box-shadow:0 10px 40px rgba(107,29,52,.12);border:1px solid #FAE8EB;z-index:50;padding:6px 0;min-width:210px}
    .dd.open{display:block}
    .dd a{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:13px;color:#284157;text-decoration:none;transition:background .1s}
    .dd a:hover{background:#F2F7F4}
    .ov{display:none;position:fixed;inset:0;z-index:40}.ov.open{display:block}
    .nav-link{padding:6px 12px;border-radius:6px;font-size:13px;font-weight:500;color:#57534e;text-decoration:none;display:flex;align-items:center;gap:4px;transition:all .15s}
    .nav-link:hover{color:#6B1D34;background:#FDF5F7}
    .nav-link.active{color:#6B1D34;background:#FDF5F7;font-weight:600;border-bottom:2px solid #6B1D34}
  </style>
</head>
<body class="bg-stone-50 min-h-screen">
  
  <!-- Header -->
  <div id="cr-header"></div>
  <script src="/shared/nav-footer.js"></script>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-6 py-8">
    
    <!-- Page Header -->
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="font-display text-3xl font-semibold text-burgundy-900 mb-2">CE Course Library</h1>
        <p class="text-forest-600">Earn continuing education credits with our professionally designed courses.</p>
      </div>
      <button onclick="syncCourses()" id="syncBtn" class="inline-flex items-center gap-2 bg-forest-100 hover:bg-forest-200 text-forest-700 font-semibold px-4 py-2 rounded-xl transition-colors">
        <svg id="syncIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        Sync
      </button>
    </div>

    <!-- Filters & Search -->
    <div class="bg-white rounded-xl border border-burgundy-100 shadow-sm p-6 mb-6">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <!-- Search -->
        <div class="md:col-span-2">
          <label for="search" class="block text-sm font-medium text-forest-700 mb-2">Search Courses</label>
          <input type="text" id="search" placeholder="Search by title or topic..." onkeyup="filterCourses()" class="w-full px-4 py-3 border border-forest-200 rounded-xl focus:ring-2 focus:ring-burgundy-500 focus:border-burgundy-500 outline-none">
        </div>

        <!-- Filter by CEU Category -->
        <div>
          <label for="filterCategory" class="block text-sm font-medium text-forest-700 mb-2">CE Category</label>
          <select id="filterCategory" onchange="filterCourses()" class="w-full px-4 py-3 border border-forest-200 rounded-xl focus:ring-2 focus:ring-burgundy-500 focus:border-burgundy-500 outline-none">
            <option value="">All Categories</option>
            <option value="ethics">Ethics</option>
            <option value="core">Core</option>
            <option value="related">Related</option>
            <option value="supervision">Supervision</option>
            <option value="telehealth">Telehealth</option>
          </select>
        </div>

        <!-- Filter by Access Type -->
        <div>
          <label for="filterAccess" class="block text-sm font-medium text-forest-700 mb-2">Access</label>
          <select id="filterAccess" onchange="filterCourses()" class="w-full px-4 py-3 border border-forest-200 rounded-xl focus:ring-2 focus:ring-burgundy-500 focus:border-burgundy-500 outline-none">
            <option value="">All Courses</option>
            <option value="free">Free Only</option>
            <option value="enrolled">My Courses</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Course Grid -->
    <div id="coursesList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Loading State -->
      <div class="md:col-span-3 text-center py-12">
        <div class="inline-block w-8 h-8 border-4 border-burgundy-200 border-t-burgundy-700 rounded-full animate-spin"></div>
        <p class="text-forest-500 mt-4">Loading courses...</p>
      </div>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden bg-white rounded-xl border border-burgundy-100 shadow-sm p-12 text-center">
      <div class="w-20 h-20 bg-forest-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-10 h-10 text-forest-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
        </svg>
      </div>
      <h3 class="font-display text-xl font-semibold text-burgundy-900 mb-2">No courses found</h3>
      <p class="text-forest-600">Try adjusting your filters or check back soon for new courses.</p>
    </div>
  </main>

  <script>
    // ── Quick-enrollment link redirect ──────────────────────────
    // Handles /courses.html?en=SLUG links (generated by admin share tools)
    // and forwards them directly to the correct course detail page.
    (function() {
      const _en = new URLSearchParams(location.search).get('enroll');
      if (_en) { location.replace('/course-details.html?slug=' + encodeURIComponent(_en)); }
    })();
    // ────────────────────────────────────────────────────────────

    const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:5000' : 'https://api.counselorready.com';
    let allCourses = [];

    async function loadCourses() {
      const token = localStorage.getItem('token');
      
      try {
        const headers = {};
        if (token) {
          headers['Authorization'] = `Bearer ${token}`;
        }

        const response = await fetch(`${API_URL}/api/interactive-courses?limit=100`, { headers, cache: 'no-store' });
        const data = await response.json();
        
        allCourses = data.data || data.courses || [];
        renderCourses(allCourses);
      } catch (error) {
        console.error('Load courses error:', error);
        document.getElementById('coursesList').innerHTML = `
          <div class="md:col-span-3 text-center py-12">
            <p class="text-burgundy-600">Failed to load courses. Please try again.</p>
          </div>
        `;
      }
    }

    // SVG badge icons
    const ICON_MEDAL = '<svg style="width:14px;height:14px;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="1.3" viewBox="0 0 16 18" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="6.5" r="5"/><path d="M5 11l-1 6 4-2 4 2-1-6"/></svg>';
    const ICON_CLOCK = '<svg style="width:14px;height:14px;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="1.3" viewBox="0 0 14 14" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="6"/><path d="M7 3.5v4l2.8 1.7"/></svg>';
    const ICON_SEAL = '<svg style="width:14px;height:14px;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 16 16" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.5l1.4 2h2.4l-.1 2.4 2.1 1.1-1.4 2 1.5 1.8-2.1 1.2.2 2.4-2.4-.1L8 16l-1.6-2.3-2.4.1.2-2.4-2.1-1.2 1.5-1.8-1.4-2L4.3 5.9 4.2 3.5h2.4z"/><path d="M6 8.2l1.3 1.3 2.7-2.7"/></svg>';

    function getContentAreas(course) {
      const areas = course.nbccContentAreas || course.contentAreas || [];
      if (!areas.length) return [];
      return areas.slice(0, 3).map(a => typeof a === 'string' ? a : (a.text || a.name || a));
    }

    function getFormatInfo(course) {
      const f = (course.deliveryFormat || course.format || 'async').toLowerCase();
      if (f.includes('live')) return { label: 'Live', bg: 'rgba(107,29,52,0.10)', color: '#6B1D34' };
      if (f.includes('hybrid')) return { label: 'Hybrid', bg: 'rgba(40,65,87,0.10)', color: '#284157' };
      return { label: 'Async', bg: 'rgba(74,124,89,0.12)', color: '#4A7C59' };
    }

    function renderCourses(courses) {
      const container = document.getElementById('coursesList');
      const emptyState = document.getElementById('emptyState');
      
      if (courses.length === 0) {
        container.classList.add('hidden');
        emptyState.classList.remove('hidden');
        return;
      }
      
      container.classList.remove('hidden');
      emptyState.classList.add('hidden');
      
      const html = courses.map(course => {
        const isEnrolled = course.enrollment?.enrolled;
        const isFree = course.accessType === 'free';
        const progress = course.enrollment?.percentComplete || 0;
        
        // Get primary CEU category
        const primaryCategory = course.ceuCategories?.[0] || (course.categories?.[0] ? {hours: course.ceHours, category: course.categories[0]} : null);
        const categoryLabel = primaryCategory ? `${primaryCategory.hours} hrs ${primaryCategory.category}` : '';
        
        return `
          <div class="bg-white rounded-xl border border-burgundy-100 shadow-sm overflow-hidden hover:shadow-lg transition-shadow">
            <!-- Thumbnail -->
            <div class="h-48 bg-gradient-to-br from-burgundy-100 to-forest-100 flex items-center justify-center">
              ${course.thumbnail ? 
                `<img src="${course.thumbnail}" alt="${course.title}" class="w-full h-full object-cover">` :
                `<svg class="w-16 h-16 text-burgundy-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                </svg>`
              }
            </div>

            <!-- Content -->
            <div class="p-5">
              <!-- Title -->
              <h3 class="font-display text-xl font-semibold text-burgundy-900 mb-2 line-clamp-2">${course.title}</h3>
              
              ${course.subtitle ? `<p class="text-forest-600 text-sm mb-3">${course.subtitle}</p>` : ''}
              
              <!-- Description -->
              <p class="text-forest-500 text-sm mb-4 line-clamp-2">${course.description}</p>

              <!-- Badges -->
              <div class="flex flex-wrap items-center gap-1.5 mb-2">
                ${(function(){
                  const ceHours = course.ceHours || course.ceuHours || 1;
                  const minutes = ceHours * 60;
                  const body = course.approvingBody === 'ACEP' ? 'NBCC' : (course.approvingBody || 'NBCC');
                  return `
                    <span style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:600;background:rgba(74,124,89,0.12);color:#4A7C59">${ICON_MEDAL} ${ceHours} CE Hr${ceHours !== 1 ? 's' : ''}</span>
                    <span style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:600;background:rgba(40,65,87,0.10);color:#284157">${ICON_CLOCK} ${minutes} min</span>
                    <span style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:600;background:rgba(107,29,52,0.10);color:#6B1D34">${ICON_SEAL} ${body}</span>
                    ${isFree ? '<span class="bg-green-100 text-green-700 px-2 py-1 rounded-full text-xs font-medium">FREE</span>' : ''}
                  `;
                })()}
              </div>
              <!-- Content area pills -->
              <div class="flex flex-wrap gap-1 mb-4">
                ${getContentAreas(course).map(a => `<span style="padding:3px 10px;border-radius:11px;font-size:9px;font-weight:500;background:rgba(212,168,85,0.15);color:#8B6914">${a}</span>`).join('')}
              </div>

              <!-- Progress Bar (if enrolled) -->
              ${isEnrolled ? `
                <div class="mb-4">
                  <div class="flex items-center justify-between text-xs text-forest-600 mb-1">
                    <span>Progress</span>
                    <span>${progress}%</span>
                  </div>
                  <div class="w-full bg-forest-100 rounded-full h-2">
                    <div class="bg-burgundy-600 h-2 rounded-full transition-all" style="width: ${progress}%"></div>
                  </div>
                </div>
              ` : ''}

              <!-- Action Button -->
              <div class="flex items-center justify-between">
                ${isEnrolled ? `
            <a href="/interactive-course.html?slug=${course.slug}" class="flex-1 text-center bg-burgundy-800 hover:bg-burgundy-900 text-white font-semibold px-4 py-2 rounded-xl transition-colors">
                    Continue Learning
                  </a>
                ` : isFree ? `
                  <button onclick="enrollCourse('${course._id}')" class="flex-1 bg-forest-700 hover:bg-forest-800 text-white font-semibold px-4 py-2 rounded-xl transition-colors">
                    Start Free Course
                  </button>
                ` : `
                  <a href="/course-details.html?slug=${course.slug}" class="flex-1 text-center bg-burgundy-800 hover:bg-burgundy-900 text-white font-semibold px-4 py-2 rounded-xl transition-colors">
                    View Details
                  </a>
                `}
              </div>
            </div>
          </div>
        `;
      }).join('');
      
      container.innerHTML = html;
    }

    function filterCourses() {
      const search = document.getElementById('search').value.toLowerCase();
      const category = document.getElementById('filterCategory').value;
      const access = document.getElementById('filterAccess').value;
      
      let filtered = allCourses.filter(course => {
        // Search filter
        const matchesSearch = !search || 
          course.title.toLowerCase().includes(search) ||
          course.description.toLowerCase().includes(search);
        
        // Category filter
        const matchesCategory = !category || 
          course.ceuCategories?.some(cat => cat.category.toLowerCase() === category);
        
        // Access filter
        let matchesAccess = true;
        if (access === 'free') {
          matchesAccess = course.accessType === 'free';
        } else if (access === 'enrolled') {
          matchesAccess = course.enrollment?.enrolled;
        }
        
        return matchesSearch && matchesCategory && matchesAccess;
      });
      
      renderCourses(filtered);
    }

    async function enrollCourse(courseId) {
      const token = localStorage.getItem('token');

      if (!token) {
        alert('Please log in to enroll in courses');
        window.location.href = '/login.html';
        return;
      }

      // Find the course slug for redirect
      const course = allCourses.find(c => c._id === courseId);
      const slug = course?.slug || courseId;

      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 10000);
        const response = await fetch(`${API_URL}/api/interactive-courses/${courseId}/enroll`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          signal: controller.signal
        });
        clearTimeout(timeout);

        if (response.ok) {
          alert('Enrolled successfully!');
          window.location.href = '/interactive-course.html?slug=' + slug;
        } else {
          const data = await response.json();
          if (response.status === 400 && (data.error || '').toLowerCase().includes('already enrolled')) {
            window.location.href = '/interactive-course.html?slug=' + slug;
          } else if (data.code === 'SUBSCRIPTION_REQUIRED') {
            if (confirm(data.message || 'This course requires a subscription. View plans?')) {
              window.location.href = '/subscription.html';
            }
          } else {
            alert(data.error || 'Failed to enroll');
          }
        }
      } catch (error) {
        console.error('Enroll error:', error);
        alert('Network error. Please try again.');
      }
    }

    // Load courses on page load
    document.addEventListener('DOMContentLoaded', loadCourses);

    async function syncCourses() {
      const btn = document.getElementById('syncBtn');
      const icon = document.getElementById('syncIcon');
      
      btn.disabled = true;
      icon.classList.add('animate-spin');
      
      await loadCourses();
      
      setTimeout(() => {
        btn.disabled = false;
        icon.classList.remove('animate-spin');
      }, 500);
    }
  </script>

  <div id="cr-footer"></div>
</body>
  </html>
