<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Help Center - CounselorReady</title>
  <link rel="stylesheet" href="/css/design-tokens.css">
  <link rel="stylesheet" href="/css/typography.css">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/js/tailwind-config.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <link rel="stylesheet" href="/lib/fontawesome/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body{background:#F8F7F4; font-family: 'Lato', system-ui, sans-serif; }
    .font-display { font-family: 'Cormorant Garamond', Georgia, serif; }
    .category-card:hover { transform: translateY(-2px); }
    .article-content h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 1rem; color: #6b1d34; }
    .article-content h2 { font-size: 1.35rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.75rem; color: #34503d; }
    .article-content h3 { font-size: 1.1rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem; color: #4A7C59; }
    .article-content p { margin-bottom: 1rem; line-height: 1.7; }
    .article-content ul, .article-content ol { margin-bottom: 1rem; padding-left: 1.5rem; }
    .article-content li { margin-bottom: 0.5rem; line-height: 1.6; }
    .article-content ul { list-style-type: disc; }
    .article-content ol { list-style-type: decimal; }
    .article-content strong { font-weight: 600; }
    .article-content code { background: #f3f4f6; padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-size: 0.9em; }
    .article-content a { color: #6b1d34; text-decoration: underline; }
  
    /* Shared nav styles */
    .dd{display:none;position:absolute;top:100%;margin-top:6px;background:#fff;border-radius:10px;box-shadow:0 10px 40px rgba(107,29,52,.12);border:1px solid #FAE8EB;z-index:50;padding:6px 0;min-width:210px}
    .dd.open{display:block}
    .dd a{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:13px;color:#284157;text-decoration:none;transition:background .1s}
    .dd a:hover{background:#F2F7F4}
    .ov{display:none;position:fixed;inset:0;z-index:40}.ov.open{display:block}
    .nav-link{padding:6px 12px;border-radius:6px;font-size:13px;font-weight:500;color:#57534e;text-decoration:none;display:flex;align-items:center;gap:4px;transition:all .15s}
    .nav-link:hover{color:#6B1D34;background:#FDF5F7}
    .nav-link.active{color:#6B1D34;background:#FDF5F7;font-weight:600;border-bottom:2px solid #6B1D34}
  </style>
<script src="/js/cr-gtag.js"></script>
</head>
<body class="bg-stone-50 min-h-screen">
  <div id="cr-header"></div>
  <script src="/shared/nav-footer.js"></script>

  <main>
    <section id="heroSection" class="py-14" style="background: #F8F7F4;">
      <div class="max-w-4xl mx-auto px-6 text-center">
        <h1 class="font-display text-3xl font-semibold mb-3" style="color: #6b1d34;">Help Center</h1>
        <p class="text-base mb-8" style="color: #284157;">Search our knowledge base or browse by category</p>
        <div class="relative max-w-2xl mx-auto">
          <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-lg" style="color: #7A9E84;"></i>
          <input type="text" id="searchInput" placeholder="Search for help articles..."
            class="w-full pl-14 pr-6 py-4 text-lg rounded-xl border text-forest-900 placeholder-forest-400 focus:ring-2 focus:outline-none"
            style="border-color: #C9D7CD; background: white;"
            onfocus="this.style.boxShadow='0 0 0 3px rgba(74,124,89,0.15)'" onblur="this.style.boxShadow='none'"
            onkeyup="handleSearch(event)">
        </div>
        <div id="searchResults" class="hidden absolute left-1/2 -translate-x-1/2 w-full max-w-2xl mt-2 bg-white rounded-xl shadow-lg border overflow-hidden z-50" style="border-color: #E2E2BE;">
          <div id="searchResultsList" class="max-h-96 overflow-y-auto"></div>
        </div>
      </div>
    </section>

    <section id="categoriesSection" class="py-12">
      <div class="max-w-6xl mx-auto px-6">
        <h2 class="font-display text-2xl font-semibold mb-6 text-center" style="color: #284157;">Browse by Category</h2>
        <div id="categoriesGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div class="col-span-full text-center py-8">
            <i class="fas fa-spinner fa-spin text-2xl text-forest-400"></i>
            <p class="text-forest-500 mt-2">Loading categories...</p>
          </div>
        </div>
      </div>
    </section>

    <section id="featuredSection" class="py-12 bg-white">
      <div class="max-w-6xl mx-auto px-6">
        <h2 class="font-display text-2xl font-semibold mb-6 text-center" style="color: #284157;">Popular Articles</h2>
        <div id="featuredArticles" class="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
          <div class="col-span-full text-center py-8"><i class="fas fa-spinner fa-spin text-2xl" style="color: #7A9E84;"></i></div>
        </div>
      </div>
    </section>

    <section id="articleSection" class="hidden py-12">
      <div class="max-w-4xl mx-auto px-6">
        <div class="mb-6">
          <button onclick="goBack()" class="text-forest-600 hover:text-forest-800 flex items-center gap-2">
            <i class="fas fa-arrow-left"></i><span>Back to Help Center</span>
          </button>
        </div>
        <article class="bg-white rounded-xl border border-burgundy-100 overflow-hidden">
          <div class="p-8">
            <div id="articleMeta" class="flex items-center gap-3 mb-4"></div>
            <div id="articleBody" class="article-content"></div>
          </div>
          <div class="border-t p-6" style="border-color: #E2E2BE; background: #FDF9F0;">
            <div id="feedbackSection">
              <p class="text-center mb-4" style="color: #284157;">Was this article helpful?</p>
              <div class="flex justify-center gap-4">
                <button onclick="submitFeedback(true)" class="px-6 py-2 rounded-lg transition-colors hover:opacity-90" style="background: #E4EBE6; color: #305538;">
                  <i class="fas fa-thumbs-up mr-2"></i>Yes
                </button>
                <button onclick="submitFeedback(false)" class="px-6 py-2 rounded-lg transition-colors hover:opacity-90" style="background: #FAE8EB; color: #6b1d34;">
                  <i class="fas fa-thumbs-down mr-2"></i>No
                </button>
              </div>
            </div>
            <div id="feedbackThanks" class="hidden text-center" style="color: #4A7C59;">
              <i class="fas fa-check-circle mr-2" style="color: #4A7C59;"></i>Thank you for your feedback!
            </div>
          </div>
        </article>
        <div id="relatedArticles" class="mt-8 hidden">
          <h3 class="font-display text-xl font-semibold text-burgundy-900 mb-4">Related Articles</h3>
          <div id="relatedArticlesList" class="grid md:grid-cols-2 gap-4"></div>
        </div>
      </div>
    </section>

    <section id="categorySection" class="hidden py-12">
      <div class="max-w-4xl mx-auto px-6">
        <div class="mb-6">
          <button onclick="goBack()" class="text-forest-600 hover:text-forest-800 flex items-center gap-2">
            <i class="fas fa-arrow-left"></i><span>Back to Help Center</span>
          </button>
        </div>
        <div class="bg-white rounded-xl border border-burgundy-100 p-6">
          <h2 id="categoryTitle" class="font-display text-2xl font-bold text-burgundy-900 mb-6"></h2>
          <div id="categoryArticles" class="space-y-3"></div>
        </div>
      </div>
    </section>

    <section class="py-14" style="background: #F2F7F4; border-top: 1px solid #C9D7CD;">
      <div class="max-w-4xl mx-auto px-6 text-center">
        <h2 class="font-display text-2xl font-semibold mb-2" style="color: #284157;">Still need help?</h2>
        <p class="mb-6" style="color: #7A98AE;">Our support team is here to assist you</p>
        <a href="mailto:support@counselorready.com" class="inline-block px-8 py-3 rounded-xl font-semibold transition-colors hover:opacity-90" style="background: #4A7C59; color: white;">
          <i class="fas fa-envelope mr-2"></i>Contact Support
        </a>
      </div>
    </section>
  </main>

  <div id="cr-footer"></div>

  <script>
    const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:5000/api' : 'https://api.counselorready.com/api';
    let currentArticle = null;
    let visitorId = localStorage.getItem('visitorId') || generateVisitorId();

    function generateVisitorId() {
      const id = 'v_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
      localStorage.setItem('visitorId', id);
      return id;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('token');
      if (token) {
        document.getElementById('dashboardLink').classList.remove('hidden');
        document.getElementById('loginLink').classList.add('hidden');
      }
      const params = new URLSearchParams(window.location.search);
      const articleSlug = params.get('article');
      const category = params.get('category');
      if (articleSlug) loadArticle(articleSlug);
      else if (category) loadCategory(category);
      else loadHomePage();
    });

    async function loadHomePage() {
      showSection('home');
      loadCategories();
      loadFeaturedArticles();
    }

    async function loadCategories() {
      try {
        const response = await fetch(`${API_URL}/help/categories`);
        const data = await response.json();
        if (data.categories && data.categories.length > 0) renderCategories(data.categories);
        else document.getElementById('categoriesGrid').innerHTML = '<div class="col-span-full text-center py-8 text-forest-500"><p>No categories available yet.</p></div>';
      } catch (error) {
        document.getElementById('categoriesGrid').innerHTML = '<div class="col-span-full text-center py-8 text-forest-500"><p>Help content coming soon!</p></div>';
      }
    }

    function renderCategories(categories) {
      const icons = {
        'getting-started': 'fa-rocket', 'courses': 'fa-graduation-cap', 'certificates': 'fa-certificate',
        'credentials': 'fa-id-card', 'subscriptions': 'fa-credit-card', 'account': 'fa-user-cog',
        'technical': 'fa-wrench', 'integrations': 'fa-plug', 'troubleshooting': 'fa-bug'
      };
      document.getElementById('categoriesGrid').innerHTML = categories.map(cat => {
        const icon = icons[cat.id] || 'fa-folder';
        return `<button onclick="loadCategory('${cat.id}')" class="category-card bg-white rounded-xl p-6 text-left transition-all border hover:shadow-md" style="border-color: #E2E2BE;">
          <div class="w-12 h-12 rounded-full flex items-center justify-center mb-3" style="background: #F2F7F4;"><i class="fas ${icon} text-xl" style="color: #4A7C59;"></i></div>
          <h3 class="font-semibold" style="color: #284157;">${cat.label}</h3>
          <p class="text-sm mt-1" style="color: #7A98AE;">${cat.count} article${cat.count !== 1 ? 's' : ''}</p>
        </button>`;
      }).join('');
    }

    async function loadFeaturedArticles() {
      try {
        const response = await fetch(`${API_URL}/help/featured`);
        const data = await response.json();
        if (data.articles && data.articles.length > 0) {
          document.getElementById('featuredArticles').innerHTML = data.articles.map(a => `
            <button onclick="loadArticle('${a.slug}')" class="bg-white rounded-xl p-5 text-left transition-all border hover:shadow-md" style="border-color: #E2E2BE;">
              <div class="w-10 h-10 rounded-lg flex items-center justify-center mb-3" style="background: #FDF9F0;"><i class="fas ${a.icon || 'fa-circle-question'}" style="color: #D4A855;"></i></div>
              <h3 class="font-semibold mb-1" style="color: #284157;">${a.title}</h3>
              <p class="text-sm line-clamp-2" style="color: #7A98AE;">${a.summary || ''}</p>
            </button>`).join('');
        } else document.getElementById('featuredSection').classList.add('hidden');
      } catch (error) { document.getElementById('featuredSection').classList.add('hidden'); }
    }

    let searchTimeout;
    function handleSearch(event) {
      clearTimeout(searchTimeout);
      const query = event.target.value.trim();
      if (query.length < 2) { document.getElementById('searchResults').classList.add('hidden'); return; }
      searchTimeout = setTimeout(() => searchArticles(query), 300);
    }

    async function searchArticles(query) {
      try {
        const response = await fetch(`${API_URL}/help/search?q=${encodeURIComponent(query)}`);
        const data = await response.json();
        const resultsDiv = document.getElementById('searchResults');
        const listDiv = document.getElementById('searchResultsList');
        if (data.articles && data.articles.length > 0) {
          listDiv.innerHTML = data.articles.map(a => `
            <button onclick="loadArticle('${a.slug}')" class="w-full px-5 py-3 text-left hover:bg-burgundy-50 border-b border-burgundy-100 last:border-0">
              <div class="flex items-center gap-3"><i class="fas ${a.icon || 'fa-circle-question'} text-forest-500"></i>
              <div><p class="font-medium text-forest-900">${a.title}</p><p class="text-sm text-forest-500 capitalize">${a.category.replace('-', ' ')}</p></div></div>
            </button>`).join('');
        } else listDiv.innerHTML = `<div class="px-5 py-4 text-center text-forest-500"><p>No articles found for "${query}"</p></div>`;
        resultsDiv.classList.remove('hidden');
      } catch (error) { console.error('Error searching:', error); }
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#searchInput') && !e.target.closest('#searchResults')) document.getElementById('searchResults').classList.add('hidden');
    });

    async function loadArticle(slug) {
      showSection('article');
      window.history.pushState({}, '', `?article=${slug}`);
      try {
        const response = await fetch(`${API_URL}/help/article/${slug}?visitorId=${visitorId}`);
        if (!response.ok) throw new Error('Article not found');
        const data = await response.json();
        currentArticle = data.article;
        renderArticle(data.article);
        if (data.article.relatedArticles && data.article.relatedArticles.length > 0) renderRelatedArticles(data.article.relatedArticles);
      } catch (error) {
        document.getElementById('articleBody').innerHTML = `<div class="text-center py-12"><i class="fas fa-exclamation-circle text-4xl text-red-400 mb-4"></i>
          <h2 class="text-xl font-semibold text-forest-900 mb-2">Article Not Found</h2>
          <p class="text-forest-600 mb-4">The article you're looking for doesn't exist.</p>
          <button onclick="goBack()" class="px-6 py-2 bg-forest-600 text-white rounded-lg hover:bg-forest-700">Return to Help Center</button></div>`;
      }
    }

    function renderArticle(article) {
      const labels = { 'getting-started': 'Getting Started', 'courses': 'Courses', 'certificates': 'Certificates', 'credentials': 'Credentials', 'subscriptions': 'Subscriptions', 'account': 'Account', 'technical': 'Technical', 'integrations': 'Integrations', 'troubleshooting': 'Troubleshooting' };
      document.getElementById('articleMeta').innerHTML = `<span class="px-3 py-1 bg-forest-100 text-forest-700 rounded-full text-sm capitalize">${labels[article.category] || article.category}</span>
        <span class="text-forest-400 text-sm"><i class="fas fa-eye mr-1"></i>${article.views || 0} views</span>`;
      document.getElementById('articleBody').innerHTML = marked.parse(article.content);
      document.getElementById('feedbackSection').classList.remove('hidden');
      document.getElementById('feedbackThanks').classList.add('hidden');
    }

    function renderRelatedArticles(articles) {
      if (articles.length === 0) { document.getElementById('relatedArticles').classList.add('hidden'); return; }
      document.getElementById('relatedArticles').classList.remove('hidden');
      document.getElementById('relatedArticlesList').innerHTML = articles.map(a => `
        <button onclick="loadArticle('${a.slug}')" class="flex items-center gap-3 p-4 bg-white rounded-lg border border-burgundy-100 hover:border-forest-300 transition-colors text-left">
          <i class="fas ${a.icon || 'fa-circle-question'} text-forest-500"></i><span class="font-medium text-forest-900">${a.title}</span>
        </button>`).join('');
    }

    async function loadCategory(categoryId) {
      showSection('category');
      window.history.pushState({}, '', `?category=${categoryId}`);
      const labels = { 'getting-started': 'Getting Started', 'courses': 'Courses & Learning', 'certificates': 'Certificates', 'credentials': 'Credentials', 'subscriptions': 'Subscriptions & Billing', 'account': 'Account Settings', 'technical': 'Technical Help', 'integrations': 'Integrations', 'troubleshooting': 'Troubleshooting' };
      document.getElementById('categoryTitle').textContent = labels[categoryId] || categoryId;
      try {
        const response = await fetch(`${API_URL}/help/articles?category=${categoryId}`);
        const data = await response.json();
        if (data.articles && data.articles.length > 0) {
          document.getElementById('categoryArticles').innerHTML = data.articles.map(a => `
            <button onclick="loadArticle('${a.slug}')" class="w-full flex items-center gap-4 p-4 bg-burgundy-50 hover:bg-burgundy-100 rounded-lg transition-colors text-left">
              <div class="w-10 h-10 bg-forest-100 rounded-lg flex items-center justify-center flex-shrink-0"><i class="fas ${a.icon || 'fa-circle-question'} text-forest-600"></i></div>
              <div class="flex-1 min-w-0"><h3 class="font-medium text-forest-900">${a.title}</h3>${a.summary ? `<p class="text-sm text-forest-500 truncate">${a.summary}</p>` : ''}</div>
              <i class="fas fa-chevron-right text-forest-400"></i>
            </button>`).join('');
        } else document.getElementById('categoryArticles').innerHTML = '<div class="text-center py-8 text-forest-500"><p>No articles in this category yet.</p></div>';
      } catch (error) { console.error('Error loading category:', error); }
    }

    async function submitFeedback(helpful) {
      if (!currentArticle) return;
      try {
        await fetch(`${API_URL}/help/article/${currentArticle.slug}/feedback`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ visitorId, helpful })
        });
        document.getElementById('feedbackSection').classList.add('hidden');
        document.getElementById('feedbackThanks').classList.remove('hidden');
      } catch (error) { console.error('Error submitting feedback:', error); }
    }

    function showSection(section) {
      document.getElementById('heroSection').classList.toggle('hidden', section === 'article');
      document.getElementById('categoriesSection').classList.toggle('hidden', section !== 'home');
      document.getElementById('featuredSection').classList.toggle('hidden', section !== 'home');
      document.getElementById('articleSection').classList.toggle('hidden', section !== 'article');
      document.getElementById('categorySection').classList.toggle('hidden', section !== 'category');
      document.getElementById('searchInput').value = '';
      document.getElementById('searchResults').classList.add('hidden');
      window.scrollTo(0, 0);
    }

    function goBack() { window.history.pushState({}, '', '/help.html'); loadHomePage(); }

    window.addEventListener('popstate', () => {
      const params = new URLSearchParams(window.location.search);
      const articleSlug = params.get('article');
      const category = params.get('category');
      if (articleSlug) loadArticle(articleSlug);
      else if (category) loadCategory(category);
      else loadHomePage();
    });
  </script>
</body>
</html>
