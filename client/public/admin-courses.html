<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Admin - CounselorReady</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            burgundy: { 50: '#fdf5f6', 100: '#fae8eb', 200: '#f5d0d6', 700: '#8b2542', 800: '#6b1d34', 900: '#4a1524' },
            forest: { 50: '#f3f6f4', 100: '#e3ebe5', 500: '#547c5f', 600: '#40634a', 700: '#34503d', 800: '#2b4133' },
            hunter: { 100: '#e8f0ea', 200: '#d1e1d5', 500: '#4A7C59', 600: '#3d6649', 700: '#34503d' },
            honey: { 100: '#fef3d1', 200: '#fde7a3', 400: '#D4A855', 500: '#c99a4a', 600: '#b8893f' },
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:wght@400;600;700&family=Source+Sans+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Source Sans Pro', system-ui, sans-serif; }
    .font-display { font-family: 'Source Serif Pro', Georgia, serif; }
  </style>
</head>
<body class="bg-stone-50 min-h-screen">

  <!-- Admin Header -->
  <header class="bg-burgundy-800 text-white sticky top-0 z-50">
    <div class="max-w-full px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <div class="w-9 h-9 bg-white/10 rounded-lg flex items-center justify-center">
          <span class="font-display font-bold"><span class="text-honey-400">C</span><span class="text-hunter-500">R</span></span>
        </div>
        <div>
          <span class="font-display font-semibold text-lg">
            <span class="text-burgundy-200">Counselor</span><span class="text-hunter-500">Ready</span>
          </span>
          <span class="ml-2 text-xs bg-honey-400 text-burgundy-900 px-2 py-0.5 rounded-full font-semibold">ADMIN</span>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <span class="text-burgundy-200 text-sm" id="adminEmail">Admin</span>
        <a href="/dashboard.html" class="text-burgundy-200 hover:text-white text-sm flex items-center gap-1">
          <i class="fas fa-arrow-left"></i> Exit Admin
        </a>
      </div>
    </div>
  </header>

  <div class="flex">
    <!-- Sidebar -->
    <aside class="w-52 bg-burgundy-800 min-h-[calc(100vh-52px)] sticky top-[52px] p-4 flex-shrink-0">
      <nav class="space-y-1 text-sm">
        <a href="/admin-courses.html" class="flex items-center gap-2 px-3 py-2 rounded-lg bg-burgundy-700 text-white">
          <i class="fas fa-book w-4"></i> Courses
        </a>
        <a href="/admin-users.html" class="flex items-center gap-2 px-3 py-2 rounded-lg text-burgundy-200 hover:bg-burgundy-700 hover:text-white transition-colors">
          <i class="fas fa-users w-4"></i> Users
        </a>
        <a href="/admin-migration.html" class="flex items-center gap-2 px-3 py-2 rounded-lg text-burgundy-200 hover:bg-burgundy-700 hover:text-white transition-colors">
          <i class="fas fa-database w-4"></i> Migration
        </a>
        <a href="/admin-messages.html" class="flex items-center gap-2 px-3 py-2 rounded-lg text-burgundy-200 hover:bg-burgundy-700 hover:text-white transition-colors">
          <i class="fas fa-envelope w-4"></i> Messages
        </a>
        <a href="/admin-hardship.html" class="flex items-center gap-2 px-3 py-2 rounded-lg text-burgundy-200 hover:bg-burgundy-700 hover:text-white transition-colors">
          <i class="fas fa-hand-holding-heart w-4"></i> Hardship Requests
        </a>
        <a href="/admin-analytics.html" class="flex items-center gap-2 px-3 py-2 rounded-lg text-burgundy-200 hover:bg-burgundy-700 hover:text-white transition-colors">
          <i class="fas fa-chart-line w-4"></i> Analytics
        </a>
        <a href="/admin-integrations.html" class="flex items-center gap-2 px-3 py-2 rounded-lg text-burgundy-200 hover:bg-burgundy-700 hover:text-white transition-colors">
          <i class="fas fa-plug w-4"></i> Integrations
        </a>
        <a href="/admin-help.html" class="flex items-center gap-2 px-3 py-2 rounded-lg text-burgundy-200 hover:bg-burgundy-700 hover:text-white transition-colors">
          <i class="fas fa-question-circle w-4"></i> Help Center
        </a>
        <div class="pt-4 border-t border-burgundy-700 mt-4">
          <p class="text-burgundy-400 text-xs uppercase tracking-wider px-3 mb-2">Quick Links</p>
          <a href="/admin-analytics.html#audit" class="flex items-center gap-2 px-3 py-2 rounded-lg text-burgundy-200 hover:bg-burgundy-700 hover:text-white transition-colors">
            <i class="fas fa-file-alt w-4"></i> Audit Reports
          </a>
        </div>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6 min-w-0">

      <!-- Top Action Bar -->
      <div class="flex items-center gap-3 mb-6 flex-wrap">
        <h1 class="font-display text-2xl font-bold text-burgundy-800 mr-4">Manage Courses</h1>
        <a href="/admin-users.html" class="flex items-center gap-1.5 px-3 py-2 bg-white border border-burgundy-200 rounded-lg text-sm text-burgundy-700 hover:bg-burgundy-50 transition-colors">
          <i class="fas fa-users text-xs"></i> Users
        </a>
        <button onclick="bulkPricingModal()" class="flex items-center gap-1.5 px-3 py-2 bg-white border border-burgundy-200 rounded-lg text-sm text-burgundy-700 hover:bg-burgundy-50 transition-colors">
          <i class="fas fa-tag text-xs"></i> Bulk Pricing
        </button>
        <a href="/admin-migration.html" class="flex items-center gap-1.5 px-3 py-2 bg-white border border-burgundy-200 rounded-lg text-sm text-burgundy-700 hover:bg-burgundy-50 transition-colors">
          <i class="fas fa-database text-xs"></i> Migration
        </a>
        <button onclick="showToast('Bulk PDF upload coming soon', '#4A7C59')" class="flex items-center gap-1.5 px-3 py-2 bg-white border border-burgundy-200 rounded-lg text-sm text-burgundy-700 hover:bg-burgundy-50 transition-colors">
          <i class="fas fa-file-pdf text-xs text-red-500"></i> Bulk PDF Upload
        </button>
        <button onclick="showToast('SCORM import coming soon', '#4A7C59')" class="flex items-center gap-1.5 px-3 py-2 bg-white border border-burgundy-200 rounded-lg text-sm text-burgundy-700 hover:bg-burgundy-50 transition-colors">
          <i class="fas fa-upload text-xs"></i> Import SCORM
        </button>
        <button onclick="openAIModal()" class="flex items-center gap-1.5 px-3 py-2 bg-hunter-500 text-white rounded-lg text-sm hover:bg-hunter-600 transition-colors font-medium">
          <i class="fas fa-wand-magic-sparkles text-xs"></i> Create with AI
        </button>
        <a href="/CourseBuilder" class="flex items-center gap-1.5 px-3 py-2 bg-burgundy-800 text-white rounded-lg text-sm hover:bg-burgundy-900 transition-colors font-medium">
          <i class="fas fa-plus text-xs"></i> + New Course
        </a>
      </div>

      <!-- Search + Filter + Bulk Actions -->
      <div class="bg-white rounded-xl border border-burgundy-100 p-4 mb-4 flex items-center gap-3 flex-wrap">
        <div class="relative flex-1 min-w-48">
          <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-forest-400 text-sm"></i>
          <input type="text" id="searchInput" placeholder="Search courses by title..." oninput="filterCourses()"
            class="w-full pl-9 pr-4 py-2 border border-burgundy-100 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-burgundy-300">
        </div>
        <div class="flex items-center gap-2">
          <label class="text-sm text-forest-600">Status:</label>
          <select id="statusFilter" onchange="filterCourses()" class="px-3 py-2 border border-burgundy-100 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-burgundy-300">
            <option value="">All</option>
            <option value="published">Published</option>
            <option value="draft">Draft</option>
          </select>
        </div>
        <div class="flex items-center gap-2 border-l border-burgundy-100 pl-3">
          <span class="text-sm text-forest-600">Bulk:</span>
          <button onclick="bulkPublish(true)" class="flex items-center gap-1 px-3 py-1.5 bg-green-50 text-green-700 border border-green-200 rounded-lg text-xs font-medium hover:bg-green-100 transition-colors">
            <i class="fas fa-check"></i> Publish All
          </button>
          <button onclick="bulkPublish(false)" class="flex items-center gap-1 px-3 py-1.5 bg-yellow-50 text-yellow-700 border border-yellow-200 rounded-lg text-xs font-medium hover:bg-yellow-100 transition-colors">
            <i class="fas fa-eye-slash"></i> Unpublish All
          </button>
        </div>
        <span class="text-sm text-forest-500 ml-auto" id="courseCount"></span>
      </div>

      <!-- Loading -->
      <div id="loadingState" class="text-center py-16">
        <div class="w-10 h-10 border-4 border-burgundy-200 border-t-burgundy-600 rounded-full animate-spin mx-auto mb-4"></div>
        <p class="text-forest-600">Loading courses...</p>
      </div>

      <!-- Error -->
      <div id="errorState" class="hidden text-center py-16 bg-white rounded-xl border border-burgundy-100">
        <i class="fas fa-exclamation-triangle text-3xl text-burgundy-300 mb-3"></i>
        <p class="text-burgundy-700 font-medium" id="errorMsg">Failed to load courses</p>
        <button onclick="loadCourses()" class="mt-4 px-4 py-2 bg-burgundy-800 text-white rounded-lg text-sm">Retry</button>
      </div>

      <!-- Course List -->
      <div id="courseList" class="hidden bg-white rounded-xl border border-burgundy-100 overflow-hidden">
        <div id="courseRows"></div>
        <!-- Pagination -->
        <div class="px-6 py-3 border-t border-burgundy-100 flex items-center justify-between">
          <span class="text-sm text-forest-500" id="pageInfo"></span>
          <div class="flex gap-2">
            <button onclick="changePage(-1)" id="prevBtn" disabled class="px-3 py-1 border border-burgundy-200 rounded text-sm hover:bg-burgundy-50 disabled:opacity-40 disabled:cursor-not-allowed">← Prev</button>
            <button onclick="changePage(1)" id="nextBtn" disabled class="px-3 py-1 border border-burgundy-200 rounded text-sm hover:bg-burgundy-50 disabled:opacity-40 disabled:cursor-not-allowed">Next →</button>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 hidden transition-all">
    <div id="toastMsg" class="px-5 py-3 rounded-xl shadow-lg text-white text-sm font-medium"></div>
  </div>

  <!-- Confirm Modal -->
  <div id="confirmModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center" style="display:none">
    <div class="bg-white rounded-2xl shadow-xl p-6 max-w-sm w-full mx-4">
      <h3 class="font-semibold text-burgundy-800 mb-2" id="confirmTitle">Confirm</h3>
      <p class="text-sm text-forest-600 mb-5" id="confirmMsg"></p>
      <div class="flex gap-3 justify-end">
        <button onclick="closeConfirm()" class="px-4 py-2 border border-burgundy-200 rounded-lg text-sm">Cancel</button>
        <button onclick="doConfirm()" id="confirmOk" class="px-4 py-2 bg-burgundy-800 text-white rounded-lg text-sm">Confirm</button>
      </div>
    </div>
  </div>

  <!-- AI Generate Modal -->
  <div id="aiModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center" style="display:none">
    <div class="bg-white rounded-2xl shadow-xl p-6 max-w-lg w-full mx-4">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-display text-lg font-semibold text-burgundy-800">Create Course with AI</h3>
        <button onclick="closeAIModal()" class="text-forest-400 hover:text-forest-600"><i class="fas fa-times"></i></button>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-burgundy-800 mb-1">Course Topic *</label>
          <input type="text" id="aiTopic" placeholder="e.g., Motivational Interviewing for Addiction Counselors"
            class="w-full px-3 py-2 border border-burgundy-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-burgundy-300">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-burgundy-800 mb-1">CE Hours</label>
            <select id="aiHours" class="w-full px-3 py-2 border border-burgundy-200 rounded-lg text-sm">
              <option value="1">1 Hour</option>
              <option value="2">2 Hours</option>
              <option value="3" selected>3 Hours</option>
              <option value="4">4 Hours</option>
              <option value="6">6 Hours</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-burgundy-800 mb-1">Category</label>
            <select id="aiCategory" class="w-full px-3 py-2 border border-burgundy-200 rounded-lg text-sm">
              <option value="ethics">Ethics</option>
              <option value="clinical">Clinical Practice</option>
              <option value="trauma">Trauma</option>
              <option value="cultural">Cultural Competence</option>
              <option value="assessment">Assessment</option>
              <option value="supervision">Supervision</option>
              <option value="special">Special Populations</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-burgundy-800 mb-1">Additional Notes (optional)</label>
          <textarea id="aiNotes" rows="2" placeholder="Target audience, focus areas, state requirements..."
            class="w-full px-3 py-2 border border-burgundy-200 rounded-lg text-sm resize-none focus:outline-none focus:ring-2 focus:ring-burgundy-300"></textarea>
        </div>
      </div>
      <div class="flex gap-3 justify-end mt-5">
        <button onclick="closeAIModal()" class="px-4 py-2 border border-burgundy-200 rounded-lg text-sm">Cancel</button>
        <button onclick="runAI()" id="aiBtn" class="px-4 py-2 bg-hunter-500 text-white rounded-lg text-sm font-medium hover:bg-hunter-600 flex items-center gap-2">
          <i class="fas fa-wand-magic-sparkles"></i> Generate Course
        </button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:5000' : 'https://api.counselorready.com';
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login.html';

    let allCourses = [];
    let filtered = [];
    let page = 1;
    const PER_PAGE = 20;
    let pendingFn = null;

    async function init() {
      try {
        const r = await fetch(`${API_URL}/api/auth/me`, { headers: { Authorization: `Bearer ${token}` } });
        if (r.ok) {
          const d = await r.json();
          const u = d.user || d;
          document.getElementById('adminEmail').textContent = u.email || 'Admin';
          if (!u.isAdmin && u.role !== 'admin') window.location.href = '/dashboard.html';
        }
      } catch(e) {}
      loadCourses();
    }

    async function loadCourses() {
      show('loadingState'); hide('courseList'); hide('errorState');
      try {
        // Fetch all published + all drafts by fetching with no status filter (admin token should return all)
        let courses = [];
        let p = 1;
        while (true) {
          const r = await fetch(`${API_URL}/api/interactive-courses?page=${p}&limit=50`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          const d = await r.json();
          const batch = d.data || [];
          courses = courses.concat(batch);
          if (p >= (d.pagination?.pages || 1) || batch.length === 0) break;
          p++;
        }

        // Also try fetching drafts separately if the API supports status filter
        try {
          const rd = await fetch(`${API_URL}/api/interactive-courses?status=draft&limit=100`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          if (rd.ok) {
            const dd = await rd.json();
            const drafts = (dd.data || []).filter(c => !courses.find(x => x._id === c._id));
            courses = courses.concat(drafts);
          }
        } catch(e) {}

        allCourses = courses;
        filterCourses();
        hide('loadingState');
        show('courseList');
      } catch(e) {
        hide('loadingState');
        show('errorState');
        document.getElementById('errorMsg').textContent = 'Failed to load: ' + e.message;
      }
    }

    function filterCourses() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const st = document.getElementById('statusFilter').value;
      filtered = allCourses.filter(c => {
        const matchQ = !q || (c.title || '').toLowerCase().includes(q);
        const matchSt = !st || c.status === st;
        return matchQ && matchSt;
      });
      // Sort: published first, then by title
      filtered.sort((a, b) => {
        if (a.status === 'published' && b.status !== 'published') return -1;
        if (a.status !== 'published' && b.status === 'published') return 1;
        return (a.title || '').localeCompare(b.title || '');
      });
      page = 1;
      render();
    }

    function render() {
      const start = (page - 1) * PER_PAGE;
      const pageItems = filtered.slice(start, start + PER_PAGE);
      document.getElementById('courseCount').textContent = `${filtered.length} courses`;
      document.getElementById('pageInfo').textContent = `${start + 1}–${Math.min(start + PER_PAGE, filtered.length)} of ${filtered.length}`;
      document.getElementById('prevBtn').disabled = page <= 1;
      document.getElementById('nextBtn').disabled = page >= Math.ceil(filtered.length / PER_PAGE);

      document.getElementById('courseRows').innerHTML = pageItems.length === 0
        ? '<div class="text-center py-12 text-forest-500">No courses found</div>'
        : pageItems.map(c => courseRow(c)).join('');
    }

    function courseRow(c) {
      const pub = c.status === 'published';
      const sections = c.sections?.length || 0;
      const tier = c.accessTier || c.pricingTier || 'Standard';
      const price = c.price ? `$${c.price}` : 'No price';

      return `
        <div class="flex items-center px-5 py-3.5 border-b border-burgundy-50 hover:bg-burgundy-50/50 transition-colors group">
          <div class="flex-1 min-w-0 pr-4">
            <a href="/course-details.html?slug=${c.slug}" target="_blank"
              class="font-medium text-burgundy-800 hover:text-burgundy-600 text-sm leading-snug block truncate">
              ${esc(c.title || 'Untitled')}
            </a>
            <div class="flex items-center gap-2 mt-0.5 text-xs text-forest-500 flex-wrap">
              <span>${sections} modules</span>
              <span>•</span>
              <span>${c.ceHours || 0} CE hrs</span>
              <span>•</span>
              <span>${price}</span>
              <span>•</span>
              <span class="${tier === 'Premium' ? 'text-honey-600 font-medium' : ''}">${tier}</span>
              <span>•</span>
              <span class="${pub ? 'text-green-600' : 'text-yellow-600'} font-medium">${pub ? 'published' : 'draft'}</span>
            </div>
          </div>
          <div class="flex items-center gap-1 opacity-70 group-hover:opacity-100 transition-opacity">
            <button onclick="enrollModal('${c._id}')" class="p-1.5 hover:bg-burgundy-100 rounded text-burgundy-500" title="Bulk Enroll">
              <i class="fas fa-user-plus text-xs"></i>
            </button>
            <a href="/admin-course-preview.html?id=${c._id}" class="p-1.5 hover:bg-burgundy-100 rounded text-burgundy-500" title="Preview">
              <i class="fas fa-eye text-xs"></i>
            </a>
            <button onclick="duplicateCourse('${c._id}', '${esc(c.title)}')" class="p-1.5 hover:bg-burgundy-100 rounded text-burgundy-500" title="Duplicate">
              <i class="fas fa-copy text-xs"></i>
            </button>
            <a href="/CourseBuilder?id=${c._id}" class="px-2.5 py-1 text-xs text-burgundy-700 hover:text-burgundy-900 font-medium hover:underline">Edit</a>
            <button onclick="togglePublish('${c._id}', '${c.status}', '${esc(c.title)}')"
              class="px-2.5 py-1 text-xs font-medium hover:underline ${pub ? 'text-yellow-600 hover:text-yellow-800' : 'text-green-600 hover:text-green-800'}">
              ${pub ? 'Unpublish' : 'Publish'}
            </button>
            <button onclick="deleteCourse('${c._id}', '${esc(c.title)}')"
              class="px-2.5 py-1 text-xs text-red-500 hover:text-red-700 font-medium hover:underline">Delete</button>
          </div>
        </div>
      `;
    }

    function changePage(d) { page += d; render(); window.scrollTo(0,0); }

    // ── Publish toggle ──
    function togglePublish(id, status, title) {
      const pub = status !== 'published';
      confirm2(
        pub ? 'Publish Course' : 'Unpublish Course',
        pub ? `"${title}" will be visible to all users.` : `"${title}" will be set to draft and hidden from users.`,
        async () => {
          try {
            const r = await fetch(`${API_URL}/api/interactive-courses/${id}`, {
              method: 'PUT',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ status: pub ? 'published' : 'draft' })
            });
            if (!r.ok) throw new Error('Update failed');
            showToast(pub ? '✓ Course published' : '✓ Course unpublished', pub ? '#4A7C59' : '#b8893f');
            loadCourses();
          } catch(e) { showToast('Error: ' + e.message, '#dc2626'); }
        }
      );
    }

    // ── Bulk publish ──
    async function bulkPublish(publish) {
      const status = document.getElementById('statusFilter').value;
      const targets = filtered.filter(c => publish ? c.status !== 'published' : c.status === 'published');
      if (targets.length === 0) { showToast('No courses to update', '#6b1d34'); return; }
      confirm2(
        publish ? `Publish ${targets.length} courses` : `Unpublish ${targets.length} courses`,
        `This will ${publish ? 'publish' : 'unpublish'} ${targets.length} courses currently shown.`,
        async () => {
          let done = 0;
          for (const c of targets) {
            try {
              await fetch(`${API_URL}/api/interactive-courses/${c._id}`, {
                method: 'PUT',
                headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: publish ? 'published' : 'draft' })
              });
              done++;
            } catch(e) {}
          }
          showToast(`✓ ${done} courses updated`, '#4A7C59');
          loadCourses();
        }
      );
    }

    // ── Delete ──
    function deleteCourse(id, title) {
      confirm2('Delete Course', `Permanently delete "${title}"? This cannot be undone.`, async () => {
        try {
          const r = await fetch(`${API_URL}/api/interactive-courses/${id}`, {
            method: 'DELETE', headers: { Authorization: `Bearer ${token}` }
          });
          if (!r.ok) throw new Error('Delete failed');
          showToast('✓ Course deleted', '#6b1d34');
          loadCourses();
        } catch(e) { showToast('Error: ' + e.message, '#dc2626'); }
      });
    }

    // ── Duplicate ──
    async function duplicateCourse(id, title) {
      try {
        showToast('Duplicating...', '#34495E');
        const r = await fetch(`${API_URL}/api/interactive-courses/${id}/duplicate`, {
          method: 'POST', headers: { Authorization: `Bearer ${token}` }
        });
        if (!r.ok) throw new Error('Duplicate not supported by API');
        showToast('✓ Course duplicated', '#4A7C59');
        loadCourses();
      } catch(e) { showToast('Duplicate: ' + e.message, '#dc2626'); }
    }

    // ── Enroll modal placeholder ──
    function enrollModal(id) { showToast('Bulk enroll: use User Management page', '#34495E'); }
    function bulkPricingModal() { showToast('Bulk pricing coming soon', '#34495E'); }

    // ── AI Generate ──
    function openAIModal() { document.getElementById('aiModal').style.display = 'flex'; }
    function closeAIModal() { document.getElementById('aiModal').style.display = 'none'; }

    async function runAI() {
      const topic = document.getElementById('aiTopic').value.trim();
      if (!topic) { showToast('Please enter a topic', '#dc2626'); return; }
      const btn = document.getElementById('aiBtn');
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';
      btn.disabled = true;
      try {
        const r = await fetch(`${API_URL}/api/ai-course-generator/generate`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            topic,
            ceHours: parseInt(document.getElementById('aiHours').value),
            category: document.getElementById('aiCategory').value,
            notes: document.getElementById('aiNotes').value
          })
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || d.message || 'Failed');
        closeAIModal();
        showToast('✓ Course generated! Opening editor...', '#4A7C59');
        const cid = d.data?._id || d.course?._id || d._id;
        setTimeout(() => { window.location.href = cid ? `/CourseBuilder?id=${cid}` : '/CourseBuilder'; }, 1500);
      } catch(e) {
        showToast('Error: ' + e.message, '#dc2626');
      } finally {
        btn.innerHTML = '<i class="fas fa-wand-magic-sparkles"></i> Generate Course';
        btn.disabled = false;
      }
    }

    // ── Confirm helper ──
    function confirm2(title, msg, fn) {
      pendingFn = fn;
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmMsg').textContent = msg;
      document.getElementById('confirmModal').style.display = 'flex';
    }
    function closeConfirm() { document.getElementById('confirmModal').style.display = 'none'; pendingFn = null; }
    function doConfirm() { closeConfirm(); if (pendingFn) pendingFn(); }

    // ── Toast ──
    function showToast(msg, bg = '#6b1d34') {
      const el = document.getElementById('toastMsg');
      el.textContent = msg;
      el.style.background = bg;
      document.getElementById('toast').classList.remove('hidden');
      clearTimeout(window._toastT);
      window._toastT = setTimeout(() => document.getElementById('toast').classList.add('hidden'), 3000);
    }

    // ── Utils ──
    function show(id) { document.getElementById(id).classList.remove('hidden'); }
    function hide(id) { document.getElementById(id).classList.add('hidden'); }
    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

    init();
  </script>
</body>
</html>
