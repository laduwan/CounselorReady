function showParser() {
  document.getElementById('crParserModal').classList.add('open');
}
function closeParser() {
  document.getElementById('crParserModal').classList.remove('open');
}

function handleDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) handleFileSelect(file);
}

function handleFileSelect(file) {
  if (!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  
  if (ext === 'json') {
    file.text().then(text => {
      try {
        const data = JSON.parse(text);
        loadCourse(data.data || data);
      } catch (e) { alert('Invalid JSON: ' + e.message); }
    });
  } else if (ext === 'md' || ext === 'txt') {
    file.text().then(text => {
      const parsed = parseMarkdownToCourse(text, file.name);
      loadCourse(parsed);
    });
  } else if (ext === 'docx' || ext === 'doc') {
    if (typeof mammoth === 'undefined') { alert('mammoth.js not loaded. Cannot parse .docx files.'); return; }
    const reader = new FileReader();
    reader.onload = function(e) {
      mammoth.convertToHtml({ arrayBuffer: e.target.result }, {
        styleMap: [
          "p[style-name='Heading 1'] => h1:fresh",
          "p[style-name='Heading 2'] => h2:fresh",
          "p[style-name='Heading 3'] => h3:fresh",
          "p[style-name='Heading 4'] => h4:fresh"
        ]
      }).then(result => {
        const parsed = parseHtmlToCourse(result.value, file.name);
        loadCourse(parsed);
        if (result.messages.length > 0) {
          console.warn('Mammoth warnings:', result.messages);
        }
      }).catch(err => alert('Error parsing .docx: ' + err.message));
    };
    reader.readAsArrayBuffer(file);
  } else if (ext === 'pdf') {
    if (typeof pdfjsLib === 'undefined') { alert('pdf.js not loaded. Cannot parse .pdf files.'); return; }
    const reader = new FileReader();
    reader.onload = function(e) {
      const typedArray = new Uint8Array(e.target.result);
      pdfjsLib.getDocument(typedArray).promise.then(async pdf => {
        let fullText = '';
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          const pageText = content.items.map(item => item.str).join(' ');
          fullText += pageText + '\n\n';
        }
        const parsed = parseMarkdownToCourse(fullText, file.name);
        loadCourse(parsed);
      }).catch(err => alert('Error parsing .pdf: ' + err.message));
    };
    reader.readAsArrayBuffer(file);
  } else {
    alert('Unsupported file type: .' + ext + '\nSupported: .json, .docx, .pdf, .md, .txt');
  }
}

// Parse HTML (from mammoth docx conversion) into course structure
function parseHtmlToCourse(html, filename) {
  const course = {
    title: filename.replace(/\.(docx?|pdf)$/i, '').replace(/[-_]/g, ' '),
    sections: [],
    objectives: [],
    references: [],
    ceHours: 1,
  };
  
  // Create a temp DOM to parse the HTML
  const container = document.createElement('div');
  container.innerHTML = html;
  
  let currentSection = null;
  let currentHtml = '';
  
  function flushText() {
    if (currentHtml.trim() && currentSection) {
      currentSection.contentBlocks.push({ type: 'text', content: currentHtml.trim() });
      currentHtml = '';
    }
  }
  
  // Walk through child nodes
  const children = container.children;
  for (let i = 0; i < children.length; i++) {
    const el = children[i];
    const tag = el.tagName.toLowerCase();
    
    // H1 = course title (first one)
    if (tag === 'h1') {
      if (!course.title || course.title === filename.replace(/\.(docx?|pdf)$/i, '').replace(/[-_]/g, ' ')) {
        course.title = el.textContent.trim();
      }
      continue;
    }
    
    // H2 = new section
    if (tag === 'h2') {
      flushText();
      const title = el.textContent.trim();
      currentSection = { title, contentBlocks: [{
        type: 'sectionDivider',
        title: title,
        sectionNumber: course.sections.length + 1,
        subtitle: ''
      }]};
      course.sections.push(currentSection);
      continue;
    }
    
    // Ensure a section exists
    if (!currentSection) {
      currentSection = { title: 'Introduction', contentBlocks: [{
        type: 'sectionDivider', title: 'Introduction', sectionNumber: 1, subtitle: ''
      }]};
      course.sections.push(currentSection);
    }
    
    // H3/H4 = keep as headings in text content
    if (tag === 'h3' || tag === 'h4') {
      currentHtml += el.outerHTML;
      continue;
    }
    
    // Everything else: accumulate as text content
    currentHtml += el.outerHTML;
    
    // Flush on large blocks to keep text blocks manageable (roughly every 1500 words)
    const wordCount = currentHtml.replace(/<[^>]*>/g, ' ').trim().split(/\s+/).length;
    if (wordCount > 1200) {
      flushText();
    }
  }
  
  flushText();
  
  if (course.sections.length === 0) {
    course.sections.push({
      title: 'Content',
      contentBlocks: [{ type: 'text', content: html }]
    });
  }
  
  return course;
}

function loadFromPaste() {
  const text = document.getElementById('crJsonPaste').value.trim();
  if (!text) return;
  try {
    const data = JSON.parse(text);
    loadCourse(data.data || data);
  } catch (e) { alert('Invalid JSON: ' + e.message); }
}

function parseMarkdownToCourse(text, filename) {
  const lines = text.split('\n');
  const course = {
    title: filename.replace(/\.(md|txt|pdf)$/i, '').replace(/[-_]/g, ' '),
    sections: [],
    objectives: [],
    references: [],
    ceHours: 1,
    assessment: { questions: [], passingScore: 80, maxAttempts: 3 },
  };
  
  // ── PHASE 1: Split into raw zones by H1 ──
  const zones = []; // { title, startLine, lines[] }
  let currentZone = { title: 'PREAMBLE', lines: [] };
  
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (/^#\s+/.test(line) && !/^##/.test(line)) {
      if (currentZone.lines.length > 0 || currentZone.title !== 'PREAMBLE') {
        zones.push(currentZone);
      }
      currentZone = { title: line.replace(/^#\s+/, '').trim(), lines: [] };
    } else {
      currentZone.lines.push(line);
    }
  }
  zones.push(currentZone);
  
  // ── PHASE 2: Process PREAMBLE → overview section + metadata ──
  // The preamble is either a literal 'PREAMBLE' zone (if text before first H1)
  // OR the first zone that isn't a MODULE or FINAL ASSESSMENT
  const preamble = zones.find(z => z.title === 'PREAMBLE') 
    || zones.find(z => !/^MODULE\s+\d+/i.test(z.title) && !/FINAL ASSESSMENT/i.test(z.title));
  if (preamble) {
    const preambleText = preamble.lines.join('\n');
    
    // Extract title from first H2 or subtitle
    const subtitleMatch = preambleText.match(/^##\s+(.+)/m);
    
    // Extract course description
    const descMatch = preambleText.match(/## Course Description\s*\n([\s\S]*?)(?=\n## |\n---\s*$)/);
    const objMatch = preambleText.match(/## Learning Objectives[\s\S]*?\n([\s\S]*?)(?=\n## |\n---\s*$)/);
    const outlineMatch = preambleText.match(/## Course Outline\s*\n([\s\S]*?)(?=\n## |\n---\s*$|\n# )/);
    
    // Extract CE hours
    const ceMatch = preambleText.match(/(\d+(?:\.\d+)?)\s*(?:Continuing Education|CE)\s*Hours/i);
    if (ceMatch) course.ceHours = parseFloat(ceMatch[1]);
    
    // Extract objectives
    if (objMatch) {
      const objLines = objMatch[1].trim().split('\n');
      objLines.forEach(l => {
        const m = l.match(/^\d+\.\s+(.+)/);
        if (m) course.objectives.push(m[1].trim());
      });
    }
    
    // Build overview section
    let overviewHtml = '';
    if (subtitleMatch) overviewHtml += `<p style="font-family:var(--cr-font-display);font-size:1.3em;color:var(--cr-navy);margin-bottom:24px">${mdInlineParse(subtitleMatch[1])}</p>`;
    
    if (descMatch) {
      overviewHtml += '<h2>Course Description</h2>';
      overviewHtml += mdBlockParse(descMatch[1].trim());
    }
    if (course.objectives.length > 0) {
      overviewHtml += '<h2>Learning Objectives</h2><ol>';
      course.objectives.forEach(o => overviewHtml += `<li>${mdInlineParse(o)}</li>`);
      overviewHtml += '</ol>';
    }
    if (outlineMatch) {
      overviewHtml += '<h2>Course Outline</h2>';
      overviewHtml += mdBlockParse(outlineMatch[1].trim());
    }
    
    // Extract metadata (target audience, level, etc.)
    const metaLines = preambleText.match(/\*\*(.+?):\*\*\s*(.+)/g);
    if (metaLines && metaLines.length > 0) {
      overviewHtml += '<div style="margin-top:24px;padding:16px;background:var(--cr-navy-faded);border-radius:var(--cr-radius)">';
      metaLines.forEach(ml => {
        const m = ml.match(/\*\*(.+?):\*\*\s*(.+)/);
        if (m && !m[1].match(/Correct Answer/i)) {
          overviewHtml += `<p style="margin-bottom:4px"><strong style="color:var(--cr-navy)">${m[1]}:</strong> ${m[2]}</p>`;
        }
      });
      overviewHtml += '</div>';
    }
    
    overviewHtml += `<div style="text-align:center;margin-top:32px">
      <button class="cr-btn cr-btn-primary" style="font-size:1.1em;padding:14px 40px" data-action="goToSection" data-idx="1">Let's Begin →</button>
    </div>`;
    
    course.sections.push({
      title: 'Course Overview',
      _isOverview: true,
      contentBlocks: [
        { type: 'sectionDivider', title: course.title, sectionNumber: '', subtitle: 'Course Overview' },
        { type: 'text', content: overviewHtml }
      ]
    });
  }
  
  // ── PHASE 3: Process MODULE zones ──
  const preambleTitle = preamble ? preamble.title : null;
  const moduleZones = zones.filter(z => 
    /^MODULE\s+\d+/i.test(z.title) && !/FINAL ASSESSMENT/i.test(z.title)
  );
  
  moduleZones.forEach((zone, mi) => {
    const moduleTitle = zone.title;
    const moduleLines = zone.lines;
    const blocks = [];
    
    blocks.push({
      type: 'sectionDivider',
      title: moduleTitle.replace(/^MODULE\s+\d+\s*[:—–\-]\s*/i, ''),
      sectionNumber: mi + 1,
      subtitle: `Module ${mi + 1}`
    });
    
    // Split module into H2 sub-sections
    const subSections = [];
    let currentSub = { heading: null, lines: [] };
    
    moduleLines.forEach(line => {
      if (/^##\s+/.test(line) && !/^###/.test(line)) {
        if (currentSub.heading || currentSub.lines.length > 0) {
          subSections.push(currentSub);
        }
        currentSub = { heading: line.replace(/^##\s+/, '').trim(), lines: [] };
      } else {
        currentSub.lines.push(line);
      }
    });
    if (currentSub.heading || currentSub.lines.length > 0) subSections.push(currentSub);
    
    subSections.forEach(sub => {
      const heading = sub.heading || '';
      const content = sub.lines.join('\n').trim();
      
      // ── SKIP: Pre-Module Pulse Check ──
      if (/Pre-Module Pulse Check|🎯.*Pulse/i.test(heading)) return;
      
      // ── KNOWLEDGE CHECK → interactive MC ──
      if (/Knowledge Check/i.test(heading)) {
        const qs = parseKCQuestions(content);
        if (qs.length > 0) {
          blocks.push({
            type: 'knowledgeCheck',
            title: heading,
            showExplanations: true,
            questions: qs
          });
        }
        return;
      }
      
      // ── CLINICAL VIGNETTE → styled card ──
      if (/Clinical Vignette|📋/i.test(heading)) {
        blocks.push({
          type: 'text',
          content: `<div class="cr-info-card cr-info-vignette">
            <div class="cr-info-card-header"><span>📋</span> ${mdInlineParse(heading.replace(/📋\s*/, ''))}</div>
            <div class="cr-info-card-body">${mdBlockParse(content)}</div>
          </div>`
        });
        return;
      }
      
      // ── MYTH vs FACT → styled card ──
      if (/Myth\s*vs\.?\s*Fact|⚡/i.test(heading)) {
        blocks.push({
          type: 'text',
          content: `<div class="cr-info-card cr-info-mythfact">
            <div class="cr-info-card-header"><span>⚡</span> ${mdInlineParse(heading.replace(/⚡\s*/, ''))}</div>
            <div class="cr-info-card-body">${mdBlockParse(content)}</div>
          </div>`
        });
        return;
      }
      
      // ── REFLECTION → reflection block ──
      if (/Reflection|🪞/i.test(heading)) {
        blocks.push({
          type: 'reflection',
          question: heading.replace(/🪞\s*/, '').replace(/Reflection Exercise:\s*/i, '') + '\n' + content.split('\n')[0],
          minLength: 50
        });
        // Also add the prompts as text
        if (content.trim()) {
          blocks.push({
            type: 'text',
            content: `<div class="cr-info-card cr-info-reflection">
              <div class="cr-info-card-header"><span>🪞</span> ${mdInlineParse(heading.replace(/🪞\s*/, ''))}</div>
              <div class="cr-info-card-body">${mdBlockParse(content)}</div>
            </div>`
          });
        }
        return;
      }
      
      // ── SELF-ASSESSMENT / SKILL BUILDER → styled card ──
      if (/Self-Assessment|Skill Builder|📊|🛠️/i.test(heading)) {
        blocks.push({
          type: 'text',
          content: `<div class="cr-info-card cr-info-activity">
            <div class="cr-info-card-header"><span>${heading.match(/📊|🛠️/) ? heading.match(/📊|🛠️/)[0] : '🔧'}</span> ${mdInlineParse(heading.replace(/📊|🛠️\s*/g, ''))}</div>
            <div class="cr-info-card-body">${mdBlockParse(content)}</div>
          </div>`
        });
        return;
      }
      
      // ── REGULAR CONTENT ──
      if (heading && content) {
        blocks.push({
          type: 'text',
          content: `<h2>${mdInlineParse(heading)}</h2>${mdBlockParse(content)}`
        });
      } else if (content) {
        blocks.push({ type: 'text', content: mdBlockParse(content) });
      }
    });
    
    course.sections.push({
      title: moduleTitle,
      _moduleTitle: moduleTitle,
      _moduleIndex: mi,
      contentBlocks: blocks
    });
  });
  
  // ── PHASE 4: Process FINAL ASSESSMENT zone ──
  const assessZone = zones.find(z => /FINAL ASSESSMENT/i.test(z.title));
  if (assessZone) {
    const assessContent = assessZone.lines.join('\n');
    // Parse the assessment questions
    const qs = parseAssessmentQuestions(assessContent);
    if (qs.length > 0) {
      course.assessment.questions = qs;
    }
  }
  
  // ── PHASE 5: Extract References ──
  const allText = text;
  const refsMatch = allText.match(/## References\s*\n([\s\S]*?)(?=\n## |\n---\s*\n## |$)/);
  if (refsMatch) {
    const refLines = refsMatch[1].trim().split('\n\n');
    refLines.forEach(ref => {
      ref = ref.trim();
      if (ref && ref.length > 10) {
        course.references.push({ citation: ref });
      }
    });
  }
  
  // Set title from preamble or first H1
  if (preamble && preamble.title !== 'PREAMBLE') {
    course.title = preamble.title;
  }
  const firstH1 = text.match(/^#\s+(.+)/m);
  if (firstH1 && !/MODULE|FINAL/i.test(firstH1[1])) {
    course.title = firstH1[1].trim();
  }
  
  if (course.sections.length === 0) {
    course.sections.push({
      title: 'Content',
      contentBlocks: [{ type: 'text', content: mdBlockParse(text) }]
    });
  }
  
  return course;
}

// ── KC Question Parser ──
function parseKCQuestions(text) {
  const questions = [];
  // Match numbered questions with lettered options
  const qPattern = /(\d+)\.\s+([\s\S]*?)(?=\n\s*\d+\.\s|\n---|\n##|$)/g;
  let match;
  
  while ((match = qPattern.exec(text)) !== null) {
    const qBlock = match[2].trim();
    // Extract question text (before first option)
    const qTextMatch = qBlock.match(/^([\s\S]*?)(?=\n\s*[a-d]\))/i);
    if (!qTextMatch) continue;
    
    const questionText = qTextMatch[1].trim();
    
    // Extract options (exclude "Correct Answer" lines)
    const optionMatches = [...qBlock.matchAll(/^\s*([a-d])\)\s*(.+)/gim)].filter(m => !m[0].includes('Correct Answer'));
    if (optionMatches.length < 2) continue;
    
    const options = optionMatches.map(m => m[2].trim());
    
    // Extract correct answer
    const correctMatch = qBlock.match(/\*\*Correct Answer:\s*([a-d])\)/i);
    let correctIdx = 0;
    if (correctMatch) {
      correctIdx = correctMatch[1].toLowerCase().charCodeAt(0) - 97; // a=0, b=1, c=2, d=3
    }
    
    // Extract explanation/rationale
    const rationaleMatch = qBlock.match(/\*Rationale:\s*([\s\S]*?)\*/);
    const explanation = rationaleMatch ? rationaleMatch[1].trim() : '';
    
    questions.push({
      question: questionText,
      type: 'multiple_choice',
      options: options,
      correctAnswer: correctIdx,
      explanation: explanation
    });
  }
  
  return questions;
}

// ── Final Assessment Question Parser (no answers inline) ──
function parseAssessmentQuestions(text) {
  const questions = [];
  
  // First try to find answer key
  const answerKeyMatch = text.match(/ANSWER KEY\s*\n([\s\S]*?)(?=\n---|\n##|$)/i);
  const answers = {};
  if (answerKeyMatch) {
    const akLines = answerKeyMatch[1].matchAll(/(\d+)\.\s*\*\*([a-d])\)/gi);
    for (const m of akLines) {
      answers[parseInt(m[1])] = m[2].toLowerCase().charCodeAt(0) - 97;
    }
  }
  
  // Parse questions (before answer key)
  const qText = answerKeyMatch ? text.substring(0, text.indexOf(answerKeyMatch[0])) : text;
  const qPattern = /(\d+)\.\s+([\s\S]*?)(?=\n\s*\d+\.\s|$)/g;
  let match;
  
  while ((match = qPattern.exec(qText)) !== null) {
    const qBlock = match[2].trim();
    const qNum = parseInt(match[1]);
    
    const qTextMatch = qBlock.match(/^([\s\S]*?)(?=\n\s*[a-d]\))/i);
    if (!qTextMatch) continue;
    
    const optionMatches = [...qBlock.matchAll(/^\s*([a-d])\)\s*(.+)/gim)].filter(m => !m[0].includes('Correct Answer'));
    if (optionMatches.length < 2) continue;
    
    questions.push({
      question: qTextMatch[1].trim(),
      type: 'multiple_choice',
      options: optionMatches.map(m => m[2].trim()),
      correctAnswer: answers[qNum] !== undefined ? answers[qNum] : 0,
      explanation: ''
    });
  }
  
  // If answer key had rationales, attach them
  if (answerKeyMatch) {
    const rationales = [...answerKeyMatch[1].matchAll(/(\d+)\.\s*\*\*[a-d]\)[^*]*\*\*\s*[—–\-]\s*(.*)/gi)];
    rationales.forEach(m => {
      const idx = parseInt(m[1]) - 1;
      if (questions[idx]) questions[idx].explanation = m[2].trim();
    });
  }
  
  return questions;
}

// ── Markdown inline parser ──
function mdInlineParse(str) {
  if (!str) return '';
  return str
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code>$1</code>');
}

// ── Markdown block parser (paragraphs, lists, tables, blockquotes) ──
function mdBlockParse(text) {
  if (!text) return '';
  const lines = text.split('\n');
  let html = '';
  let inList = false;
  let inTable = false;
  
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    
    // Skip empty lines
    if (!line.trim()) {
      if (inList) { html += '</ul>'; inList = false; }
      if (inTable) { html += '</tbody></table>'; inTable = false; }
      continue;
    }
    
    // Table
    if (line.includes('|') && line.trim().startsWith('|')) {
      if (line.match(/^\|[\s-:|]+\|$/)) continue; // separator row
      const cells = line.split('|').filter(c => c.trim()).map(c => mdInlineParse(c.trim()));
      if (!inTable) {
        html += '<table style="width:100%;border-collapse:collapse;margin:12px 0"><thead><tr>';
        cells.forEach(c => html += `<th style="padding:8px 12px;border-bottom:2px solid var(--cr-border);text-align:left;font-weight:700;color:var(--cr-navy)">${c}</th>`);
        html += '</tr></thead><tbody>';
        inTable = true;
      } else {
        html += '<tr>';
        cells.forEach(c => html += `<td style="padding:8px 12px;border-bottom:1px solid var(--cr-border)">${c}</td>`);
        html += '</tr>';
      }
      continue;
    }
    if (inTable && !line.includes('|')) { html += '</tbody></table>'; inTable = false; }
    
    // H3/H4
    if (/^###\s+/.test(line) && !/^####/.test(line)) {
      if (inList) { html += '</ul>'; inList = false; }
      html += `<h3>${mdInlineParse(line.replace(/^###\s+/, ''))}</h3>`;
      continue;
    }
    if (/^####\s+/.test(line)) {
      if (inList) { html += '</ul>'; inList = false; }
      html += `<h4>${mdInlineParse(line.replace(/^#{4,}\s+/, ''))}</h4>`;
      continue;
    }
    
    // Horizontal rule
    if (/^[-*_]{3,}\s*$/.test(line)) { continue; } // just skip hr in parsed content
    
    // Blockquote
    if (/^>\s*/.test(line)) {
      if (inList) { html += '</ul>'; inList = false; }
      html += `<blockquote><p>${mdInlineParse(line.replace(/^>\s*/, ''))}</p></blockquote>`;
      continue;
    }
    
    // Unordered list
    if (/^[-*+]\s+/.test(line)) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${mdInlineParse(line.replace(/^[-*+]\s+/, ''))}</li>`;
      continue;
    }
    
    // Numbered list
    if (/^\d+[.)]\s+/.test(line)) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${mdInlineParse(line.replace(/^\d+[.)]\s+/, ''))}</li>`;
      continue;
    }
    
    // Close list if non-list line
    if (inList) { html += '</ul>'; inList = false; }
    
    // Regular paragraph
    html += `<p>${mdInlineParse(line.trim())}</p>`;
  }
  
  if (inList) html += '</ul>';
  if (inTable) html += '</tbody></table>';
  
  return html;
}

// ═══════════════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════════════
function esc(str) {
  if (!str) return '';
  const d = document.createElement('div');
  d.textContent = String(str);
  return d.innerHTML;
}

function addKeyboardDragSupport() {
  document.querySelectorAll('.cr-sequencing-item[draggable="true"]').forEach(item => {
    if (item._kbReady) return;
    item._kbReady = true;
    item.setAttribute('tabindex', '0');
    item.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        const parent = this.parentElement;
        const items = [...parent.querySelectorAll('.cr-sequencing-item')];
        const idx = items.indexOf(this);
        if (e.key === 'ArrowUp' && idx > 0) parent.insertBefore(this, items[idx - 1]);
        if (e.key === 'ArrowDown' && idx < items.length - 1) parent.insertBefore(items[idx + 1], this);
        parent.querySelectorAll('.cr-seq-num').forEach((n, i) => n.textContent = i + 1);
        this.focus();
      }
    });
  });
  
  // Card sort: keyboard tap-to-place
  document.querySelectorAll('.cr-cardsort-card').forEach(card => {
    if (card._kbReady) return;
    card._kbReady = true;
    card.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        // Cycle through categories
        const cats = [...this.closest('.cr-cardsort').querySelectorAll('.cr-cardsort-category-cards')];
        const currentCat = this.closest('.cr-cardsort-category-cards');
        const pool = this.closest('.cr-cardsort-pool');
        
        if (pool) {
          // Move to first category
          cats[0]?.appendChild(this);
        } else if (currentCat) {
          const idx = cats.indexOf(currentCat);
          if (idx < cats.length - 1) {
            cats[idx + 1].appendChild(this);
          } else {
            // Move back to pool
            this.closest('.cr-cardsort').querySelector('.cr-cardsort-pool')?.appendChild(this);
          }
        }
        this.focus();
      }
    });
  });
}

// Close a11y panel on outside click
document.addEventListener('click', (e) => {
  const panel = document.getElementById('crA11yPanel');
  const btn = document.getElementById('crA11yBtn');
  if (panel.classList.contains('open') && !panel.contains(e.target) && !btn.contains(e.target)) {
    panel.classList.remove('open');
  }
});

// Keyboard: Escape closes sidebar/panels
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeSidebar();
    document.getElementById('crA11yPanel').classList.remove('open');
    closeParser();
  }
});
// ═══════════════════════════════════════════════════════════════
// EVENT DELEGATION — replaces all onclick handlers for
// compatibility with sanitized HTML renderers (claude.ai, iframes)
// ═══════════════════════════════════════════════════════════════
document.addEventListener('click', function(e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  
  const action = el.dataset.action;
  const target = el.dataset.target;
  const idx = el.dataset.idx !== undefined ? parseInt(el.dataset.idx) : undefined;
  
  switch (action) {
    // ─── Knowledge Checks ───
    case 'selectMC': selectMC(target, idx); break;
    case 'submitMC': submitMC(target, parseInt(el.dataset.correct)); break;
    case 'toggleMS': toggleMS(target, idx); break;
    case 'submitMS': submitMS(target); break;
    
    // ─── Accordion ───
    case 'toggleAccordion': toggleAccordion(el); break;
    
    // ─── Matching ───
    case 'selectMatchTerm': selectMatchTerm(target, idx); break;
    case 'selectMatchDef': selectMatchDef(target, idx); break;
    
    // ─── Flashcards ───
    case 'flipCard': flipCard(target); break;
    case 'fcNav': fcNav(target, parseInt(el.dataset.dir)); break;
    
    // ─── Scenario Tree ───
    case 'stChoose': stChoose(target, el.dataset.next, el); break;
    case 'scenarioRestart': renderScenarioNode(target, el.dataset.node); break;
    
    // ─── Card Sort ───
    case 'csTapCard': csTapCard(e, target); break;
    case 'csTapCategory': csTapCategory(e, target); break;
    case 'csCheck': csCheck(target); break;
    
    // ─── Sequencing ───
    case 'seqMove': seqMove(target, el, parseInt(el.dataset.dir)); break;
    case 'seqCheck': seqCheck(target); break;
    
    // ─── Hotspot ───
    case 'hsReveal': hsReveal(target, parseInt(el.dataset.spot)); break;
    
    // ─── Navigation ───
    case 'prevSection': prevSection(); break;
    case 'nextSection': nextSection(); break;
    case 'goToSection': goToSection(idx); break;
    case 'showAssessment': showAssessment(); break;
    
    // ─── Assessment ───
    case 'assessmentSelect': assessmentSelect(parseInt(el.dataset.q), parseInt(el.dataset.opt)); break;
    case 'submitAssessment': submitAssessment(); break;
    case 'retryAssessment': retryAssessment(); break;
    
    // ─── Sidebar / UI ───
    case 'toggleSidebar': toggleSidebar(); break;
    case 'closeSidebar': closeSidebar(); break;
    case 'toggleTTS': toggleTTS(); break;
    
    // ─── Accessibility ───
    case 'toggleA11yPanel': toggleA11yPanel(); break;
    case 'setSetting': setSetting(el.dataset.setting, el.dataset.value); break;
    case 'toggleBool': toggleBool(el.dataset.setting); break;
    case 'toggleReadAloud': toggleReadAloud(); break;
    
    // ─── Parser / File ───
    case 'showParser': showParser(); break;
    case 'closeParser': closeParser(); break;
    case 'loadFromPaste': loadFromPaste(); break;
    case 'openFileInput': document.getElementById('crFileInput').click(); break;
    
    // ─── Downloads ───
    case 'downloadCourseText': downloadCourseText(); break;
    case 'downloadCourseJSON': downloadCourseJSON(); break;
    
    // ─── Certificate ───
    case 'requestCertificate':
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'REQUEST_CERTIFICATE' }, '*');
      } else {
        alert('Certificate generation available when embedded in CounselorReady');
      }
      break;
  }
});

// Handle file input change (can't use click delegation for onchange)
document.addEventListener('change', function(e) {
  if (e.target.id === 'crFileInput') {
    handleFileSelect(e.target.files[0]);
  }
});

// Handle textarea input for reflection word count
document.addEventListener('input', function(e) {
  if (e.target.closest('.cr-reflection')) {
    const refBlock = e.target.closest('.cr-reflection');
    const id = e.target.id;
    if (id) {
      const baseId = id.replace('-textarea', '');
      const minLen = parseInt(e.target.dataset.minlen) || 50;
      refCount(baseId, minLen);
    }
  }
});

// Handle drag-and-drop for parser dropzone
const dropzone = document.getElementById('crDropzone');
if (dropzone) {
  dropzone.addEventListener('dragover', function(e) { e.preventDefault(); this.classList.add('dragover'); });
  dropzone.addEventListener('dragleave', function() { this.classList.remove('dragover'); });
  dropzone.addEventListener('drop', function(e) { e.preventDefault(); this.classList.remove('dragover'); handleDrop(e); });
  dropzone.addEventListener('click', function() { document.getElementById('crFileInput').click(); });
}

// Handle drag-and-drop for card sort (desktop)
document.addEventListener('dragstart', function(e) {
  if (e.target.classList && e.target.classList.contains('cr-cardsort-card')) {
    csDragData = e.target;
    e.dataTransfer.effectAllowed = 'move';
  }
});
document.addEventListener('dragover', function(e) {
  if (e.target.closest && e.target.closest('.cr-cardsort-category')) {
    e.preventDefault();
    e.target.closest('.cr-cardsort-category').classList.add('dragover');
  }
});
document.addEventListener('dragleave', function(e) {
  if (e.target.closest && e.target.closest('.cr-cardsort-category')) {
    e.target.closest('.cr-cardsort-category').classList.remove('dragover');
  }
});
document.addEventListener('drop', function(e) {
  const cat = e.target.closest && e.target.closest('.cr-cardsort-category');
  if (cat && csDragData) {
    e.preventDefault();
    cat.classList.remove('dragover');
    cat.querySelector('.cr-cardsort-category-cards').appendChild(csDragData);
    csDragData = null;
  }
});
