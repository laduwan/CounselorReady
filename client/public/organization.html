<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organization | CounselorReady</title>
  <link rel="stylesheet" href="/css/design-tokens.css">
  <link rel="stylesheet" href="/css/typography.css">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/js/tailwind-config.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <style>
    body{background:#F8F7F4; font-family: 'Lato', system-ui, sans-serif; }
    .font-display { font-family: 'Cormorant Garamond', Georgia, serif; }
  
    /* Shared nav styles */
    .dd{display:none;position:absolute;top:100%;margin-top:6px;background:#fff;border-radius:10px;box-shadow:0 10px 40px rgba(107,29,52,.12);border:1px solid #FAE8EB;z-index:50;padding:6px 0;min-width:210px}
    .dd.open{display:block}
    .dd a{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:13px;color:#284157;text-decoration:none;transition:background .1s}
    .dd a:hover{background:#F2F7F4}
    .ov{display:none;position:fixed;inset:0;z-index:40}.ov.open{display:block}
    .nav-link{padding:6px 12px;border-radius:6px;font-size:13px;font-weight:500;color:#57534e;text-decoration:none;display:flex;align-items:center;gap:4px;transition:all .15s}
    .nav-link:hover{color:#6B1D34;background:#FDF5F7}
    .nav-link.active{color:#6B1D34;background:#FDF5F7;font-weight:600;border-bottom:2px solid #6B1D34}
  </style>
</head>
<body class="bg-stone-50 min-h-screen">

  <!-- ═══════ HEADER (matches dashboard.html) ═══════ -->
  <div id="cr-header"></div>
  <script src="/shared/nav-footer.js"></script>

  <!-- ═══════ MAIN CONTENT ═══════ -->
  <main class="max-w-5xl mx-auto px-6 py-8">

    <!-- Breadcrumb -->
    <a href="/dashboard.html" class="inline-flex items-center gap-2 text-sm text-gray-500 hover:text-burgundy-700 mb-4">
      <i class="fas fa-chevron-left text-xs"></i> Dashboard
    </a>

    <!-- Page Header -->
    <div class="flex items-start justify-between mb-6">
      <div>
        <h1 class="font-display text-3xl font-semibold text-burgundy-900">Organization</h1>
        <p class="text-gray-500 mt-1">Manage your group practice or organization</p>
      </div>
      <button onclick="toggleCreateForm()" id="createOrgBtn" class="flex items-center gap-2 px-4 py-2 bg-burgundy-700 text-white rounded-lg hover:bg-burgundy-800 text-sm font-medium">
        <i class="fas fa-plus text-xs"></i> New Organization
      </button>
    </div>

    <!-- Message Toast -->
    <div id="toast" class="hidden mb-4 p-3 rounded-lg text-sm"></div>

    <!-- Create Organization Form (hidden by default) -->
    <div id="createForm" class="hidden bg-white rounded-xl border border-gray-200 p-6 mb-6">
      <h2 class="font-display text-xl font-semibold text-burgundy-900 mb-4">Create Organization</h2>
      <form id="createOrgForm" class="grid md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Organization Name *</label>
          <input type="text" id="orgName" required class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-burgundy-300 focus:border-burgundy-400">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Type</label>
          <select id="orgType" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-burgundy-300 focus:border-burgundy-400">
            <option value="group_practice">Group Practice</option>
            <option value="agency">Agency</option>
            <option value="training_center">Training Center</option>
            <option value="university">University</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
          <input type="tel" id="orgPhone" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-burgundy-300 focus:border-burgundy-400">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Website</label>
          <input type="url" id="orgWebsite" placeholder="https://" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-burgundy-300 focus:border-burgundy-400">
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Street Address</label>
          <input type="text" id="orgStreet" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-burgundy-300 focus:border-burgundy-400">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">City</label>
          <input type="text" id="orgCity" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-burgundy-300 focus:border-burgundy-400">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">State</label>
            <input type="text" id="orgState" maxlength="2" placeholder="GA" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-burgundy-300 focus:border-burgundy-400">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">ZIP</label>
            <input type="text" id="orgZip" maxlength="10" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-burgundy-300 focus:border-burgundy-400">
          </div>
        </div>
        <div class="md:col-span-2 flex justify-end gap-3 pt-2">
          <button type="button" onclick="toggleCreateForm()" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-burgundy-700 text-white rounded-lg hover:bg-burgundy-800 text-sm font-medium">Create</button>
        </div>
      </form>
    </div>

    <!-- Loading Spinner -->
    <div id="loading" class="text-center py-16">
      <div class="animate-spin rounded-full h-10 w-10 border-4 border-burgundy-200 border-t-burgundy-700 mx-auto mb-4"></div>
      <p class="text-gray-500">Loading organization data...</p>
    </div>

    <!-- Content (hidden until loaded) -->
    <div id="content" class="hidden">

      <!-- Empty State -->
      <div id="emptyState" class="hidden bg-white rounded-xl border border-gray-200 p-12 text-center">
        <i class="fas fa-building text-4xl text-gray-300 mb-4"></i>
        <h2 class="text-lg font-semibold text-gray-700 mb-2">No Organization Yet</h2>
        <p class="text-gray-500 mb-4">Create an organization to manage your team's CE compliance in one place.</p>
        <button onclick="toggleCreateForm()" class="px-4 py-2 bg-burgundy-700 text-white rounded-lg hover:bg-burgundy-800 text-sm font-medium">Create Organization</button>
      </div>

      <!-- Org Selector (for multiple orgs) -->
      <div id="orgSelector" class="hidden flex gap-2 mb-6 flex-wrap"></div>

      <!-- Stats Cards -->
      <div id="statsCards" class="hidden grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
        <div class="bg-white rounded-xl border border-gray-200 p-4">
          <div class="flex items-center gap-3">
            <div class="p-2 bg-blue-50 rounded-lg"><i class="fas fa-users text-blue-600"></i></div>
            <div>
              <p class="text-2xl font-bold text-gray-900" id="statTotalMembers">0</p>
              <p class="text-xs text-gray-500">Total Members</p>
            </div>
          </div>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-4">
          <div class="flex items-center gap-3">
            <div class="p-2 bg-green-50 rounded-lg"><i class="fas fa-shield-alt text-green-600"></i></div>
            <div>
              <p class="text-2xl font-bold text-green-600" id="statActiveMembers">0</p>
              <p class="text-xs text-gray-500">Active Members</p>
            </div>
          </div>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-4">
          <div class="flex items-center gap-3">
            <div class="p-2 bg-burgundy-50 rounded-lg"><i class="fas fa-chart-pie text-burgundy-700"></i></div>
            <div>
              <p class="text-2xl font-bold text-burgundy-700" id="statComplianceRate">0%</p>
              <p class="text-xs text-gray-500">Compliance Rate</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Members Table -->
      <div id="membersCard" class="hidden bg-white rounded-xl border border-gray-200">
        <div class="p-4 border-b border-gray-200 flex items-center justify-between">
          <h2 class="font-display text-xl font-semibold text-burgundy-900">Team Members</h2>
          <button onclick="toggleInviteForm()" class="flex items-center gap-2 px-3 py-1.5 bg-burgundy-100 text-burgundy-800 rounded-lg hover:bg-burgundy-200 text-sm font-medium">
            <i class="fas fa-envelope text-xs"></i> Invite
          </button>
        </div>

        <!-- Invite Form (hidden by default) -->
        <div id="inviteForm" class="hidden p-4 border-b border-gray-200 bg-gray-50">
          <form id="inviteMemberForm" class="flex flex-col sm:flex-row gap-3 items-end">
            <div class="flex-1">
              <label class="block text-xs font-medium text-gray-600 mb-1">Email</label>
              <input type="email" id="inviteEmail" required placeholder="colleague@example.com" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-burgundy-300 focus:border-burgundy-400">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Role</label>
              <select id="inviteRole" class="px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-burgundy-300 focus:border-burgundy-400">
                <option value="member">Member</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <button type="submit" class="px-4 py-2 bg-burgundy-700 text-white rounded-lg hover:bg-burgundy-800 text-sm font-medium whitespace-nowrap">Send Invite</button>
          </form>
        </div>

        <!-- Members List -->
        <div id="membersList" class="divide-y divide-gray-100"></div>
      </div>

    </div><!-- end #content -->

  </main>

  <script>
    const API = location.hostname === 'localhost' ? 'http://localhost:5000' : 'https://api.counselorready.com';
    const T = localStorage.getItem('token');
    if (!T) location.href = '/login.html';

    let allOrgs = [];
    let selectedOrg = null;
    let dashboardData = null;

    // ── User Avatar from JWT ──
    try {
      const p = JSON.parse(atob(T.split('.')[1]));
      document.getElementById('userName').textContent = p.name || '';
      document.getElementById('userAvatar').textContent = (p.name || '--').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
    } catch (e) {}

    // ── Helpers ──
    function esc(str) {
      if (!str) return '';
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function showToast(type, text) {
      const toast = document.getElementById('toast');
      toast.className = `mb-4 p-3 rounded-lg text-sm ${type === 'success' ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-red-50 text-red-700 border border-red-200'}`;
      toast.textContent = text;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 5000);
    }

    function toggleCreateForm() {
      document.getElementById('createForm').classList.toggle('hidden');
    }

    function toggleInviteForm() {
      document.getElementById('inviteForm').classList.toggle('hidden');
    }

    // ── Auth header helper ──
    function authHeaders() {
      return { 'Authorization': 'Bearer ' + T, 'Content-Type': 'application/json' };
    }

    // ── Init ──
    document.addEventListener('DOMContentLoaded', init);

    async function init() {
      try {
        const res = await fetch(API + '/api/organizations/mine', { headers: authHeaders() });
        if (!res.ok) throw new Error('Failed to load organizations');
        allOrgs = await res.json();

        if (allOrgs.length > 0) {
          selectedOrg = allOrgs[0];
          await loadDashboard(selectedOrg._id);
        }

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
        render();
      } catch (err) {
        console.error('Init error:', err);
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
        render();
      }
    }

    async function loadDashboard(orgId) {
      try {
        const res = await fetch(API + '/api/organizations/' + orgId + '/dashboard', { headers: authHeaders() });
        if (!res.ok) throw new Error('Failed to load dashboard');
        dashboardData = await res.json();
      } catch (err) {
        console.error('Dashboard load error:', err);
        dashboardData = null;
      }
    }

    // ── Render ──
    function render() {
      const emptyState = document.getElementById('emptyState');
      const orgSelector = document.getElementById('orgSelector');
      const statsCards = document.getElementById('statsCards');
      const membersCard = document.getElementById('membersCard');

      if (allOrgs.length === 0) {
        emptyState.classList.remove('hidden');
        orgSelector.classList.add('hidden');
        statsCards.classList.add('hidden');
        membersCard.classList.add('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      // Org selector (multiple orgs)
      if (allOrgs.length > 1) {
        orgSelector.classList.remove('hidden');
        orgSelector.innerHTML = allOrgs.map(org =>
          `<button onclick="selectOrg('${org._id}')" class="px-4 py-2 rounded-lg text-sm font-medium transition-colors ${selectedOrg && selectedOrg._id === org._id ? 'bg-burgundy-700 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}">
            <i class="fas fa-building mr-1"></i> ${esc(org.name)}
          </button>`
        ).join('');
      } else {
        orgSelector.classList.add('hidden');
      }

      // Stats and members
      if (dashboardData) {
        statsCards.classList.remove('hidden');
        membersCard.classList.remove('hidden');

        const stats = dashboardData.stats || {};
        const members = dashboardData.members || [];

        // Stat values
        const totalMembers = stats.totalMembers || members.length || 0;
        const compliant = stats.compliant || 0;
        const activeMembers = stats.activeMembers || totalMembers;
        const complianceRate = totalMembers > 0 ? Math.round((compliant / totalMembers) * 100) : 0;

        document.getElementById('statTotalMembers').textContent = totalMembers;
        document.getElementById('statActiveMembers').textContent = activeMembers;
        document.getElementById('statComplianceRate').textContent = complianceRate + '%';

        // Members list
        const membersList = document.getElementById('membersList');
        if (members.length === 0) {
          membersList.innerHTML = '<div class="p-8 text-center text-gray-500 text-sm">No team members yet. Invite your first team member above.</div>';
        } else {
          membersList.innerHTML = members.map(member => {
            const statusDot = member.complianceStatus === 'compliant' ? 'bg-green-500'
              : member.complianceStatus === 'at_risk' ? 'bg-yellow-500'
              : 'bg-red-500';

            const roleBadge = member.role === 'admin' || member.role === 'owner'
              ? `<span class="px-2 py-0.5 bg-burgundy-100 text-burgundy-700 text-xs font-medium rounded-full">${esc(member.role)}</span>`
              : `<span class="px-2 py-0.5 bg-gray-100 text-gray-600 text-xs font-medium rounded-full">${esc(member.role || 'member')}</span>`;

            const statusLabel = member.status === 'active'
              ? '<span class="text-xs text-green-600 font-medium">Active</span>'
              : member.status === 'invited'
                ? '<span class="text-xs text-amber-600 font-medium">Invited</span>'
                : '<span class="text-xs text-gray-400 font-medium">' + esc(member.status || 'active') + '</span>';

            return `
            <div class="p-4 hover:bg-gray-50/50 transition-colors">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div class="w-2.5 h-2.5 rounded-full flex-shrink-0 ${statusDot}"></div>
                  <div>
                    <div class="flex items-center gap-2">
                      <p class="font-medium text-gray-900">${esc(member.name || 'Unnamed')}</p>
                      ${roleBadge}
                    </div>
                    <p class="text-xs text-gray-500">${esc(member.email || '')}</p>
                  </div>
                </div>
                <div class="flex items-center gap-4">
                  ${statusLabel}
                  ${member.seatId ? `<button onclick="removeMember('${member.seatId}')" class="p-1.5 text-gray-400 hover:text-red-600 transition-colors" title="Remove member"><i class="fas fa-trash-alt text-sm"></i></button>` : ''}
                </div>
              </div>
            </div>`;
          }).join('');
        }
      } else {
        statsCards.classList.add('hidden');
        membersCard.classList.add('hidden');
      }
    }

    // ── Select Org ──
    async function selectOrg(orgId) {
      selectedOrg = allOrgs.find(o => o._id === orgId);
      await loadDashboard(orgId);
      render();
    }

    // ── Create Organization ──
    document.getElementById('createOrgForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const body = {
        name: document.getElementById('orgName').value,
        type: document.getElementById('orgType').value,
        phone: document.getElementById('orgPhone').value,
        website: document.getElementById('orgWebsite').value,
        address: {
          street: document.getElementById('orgStreet').value,
          city: document.getElementById('orgCity').value,
          state: document.getElementById('orgState').value,
          zip: document.getElementById('orgZip').value
        }
      };

      try {
        const res = await fetch(API + '/api/organizations', {
          method: 'POST', headers: authHeaders(), body: JSON.stringify(body)
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || 'Failed to create organization');
        }
        const data = await res.json();
        allOrgs.push(data);
        selectedOrg = data;
        await loadDashboard(data._id);
        toggleCreateForm();
        document.getElementById('createOrgForm').reset();
        showToast('success', 'Organization created successfully');
        render();
      } catch (err) {
        showToast('error', err.message);
      }
    });

    // ── Invite Member ──
    document.getElementById('inviteMemberForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!selectedOrg) return;

      const body = {
        email: document.getElementById('inviteEmail').value,
        role: document.getElementById('inviteRole').value
      };

      try {
        const res = await fetch(API + '/api/organizations/' + selectedOrg._id + '/invite', {
          method: 'POST', headers: authHeaders(), body: JSON.stringify(body)
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || 'Failed to send invitation');
        }
        document.getElementById('inviteEmail').value = '';
        toggleInviteForm();
        await loadDashboard(selectedOrg._id);
        showToast('success', 'Invitation sent');
        render();
      } catch (err) {
        showToast('error', err.message);
      }
    });

    // ── Remove Member ──
    async function removeMember(seatId) {
      if (!selectedOrg) return;
      if (!confirm('Remove this member from the organization?')) return;

      try {
        const res = await fetch(API + '/api/organizations/' + selectedOrg._id + '/members/' + seatId, {
          method: 'DELETE', headers: authHeaders()
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || 'Failed to remove member');
        }
        await loadDashboard(selectedOrg._id);
        showToast('success', 'Member removed');
        render();
      } catch (err) {
        showToast('error', err.message);
      }
    }
  </script>
<script src="/js/cr-icons.js"></script>

  <div id="cr-footer"></div>
</body>
</html>
