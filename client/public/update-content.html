<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Course Content - CounselorReady</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/design-tokens.css">
  <link rel="stylesheet" href="/css/typography.css">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/js/tailwind-config.js"></script>
  
  <style>
    /* Shared nav styles */
    .dd{display:none;position:absolute;top:100%;margin-top:6px;background:#fff;border-radius:10px;box-shadow:0 10px 40px rgba(107,29,52,.12);border:1px solid #FAE8EB;z-index:50;padding:6px 0;min-width:210px}
    .dd.open{display:block}
    .dd a{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:13px;color:#284157;text-decoration:none;transition:background .1s}
    .dd a:hover{background:#F2F7F4}
    .ov{display:none;position:fixed;inset:0;z-index:40}.ov.open{display:block}
    .nav-link{padding:6px 12px;border-radius:6px;font-size:13px;font-weight:500;color:#57534e;text-decoration:none;display:flex;align-items:center;gap:4px;transition:all .15s}
    .nav-link:hover{color:#6B1D34;background:#FDF5F7}
    .nav-link.active{color:#6B1D34;background:#FDF5F7;font-weight:600;border-bottom:2px solid #6B1D34}
  </style>
</head>
<body class="bg-stone-50 min-h-screen flex items-center justify-center p-6" style="background:#F8F7F4">

  <div id="cr-header"></div>
  <script src="/shared/nav-footer.js"></script>

  <div class="max-w-2xl w-full bg-white rounded-xl border border-burgundy-100 shadow-lg p-8">
    <h1 class="text-3xl font-bold text-burgundy-900 mb-2">Update Course Content</h1>
    <p class="text-forest-600 mb-6">This will add real educational content to your sample courses.</p>
    
    <div id="status" class="mb-6">
      <div class="bg-forest-50 border border-forest-200 rounded-lg p-4">
        <h3 class="font-semibold text-forest-800 mb-2">Ready to Update</h3>
        <ul class="text-sm text-forest-700 space-y-1">
          <li>✓ Ethics in Telehealth Practice</li>
          <li>✓ Clinical Documentation Essentials</li>
        </ul>
      </div>
    </div>
    
    <button onclick="updateCourses()" id="updateBtn" class="w-full bg-burgundy-800 hover:bg-burgundy-900 text-white font-semibold px-6 py-3 rounded-xl transition-colors">
      Update Courses Now
    </button>
    
    <div id="result" class="hidden mt-6">
      <!-- Results shown here -->
    </div>
  </div>

  <script>
    const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:5000' : 'https://api.counselorready.com';
    
    const courseUpdates = {
      'clinical-documentation': {
        'modules.0.lessons.0': {
          title: 'Why Documentation Matters',
          type: 'text',
          content: `
            <h2>The Importance of Clinical Documentation</h2>
            <p>Clinical documentation is one of the most critical skills for mental health professionals. Quality documentation serves multiple essential purposes:</p>
            
            <h3>1. Legal Protection</h3>
            <p>Your clinical notes are legal documents that protect both you and your clients. In the event of a complaint, lawsuit, or audit, your documentation demonstrates that you provided appropriate care.</p>
            
            <h3>2. Continuity of Care</h3>
            <p>Good documentation ensures seamless care whether you're sick, on vacation, or a client transfers to another provider.</p>
            
            <h3>3. Insurance Reimbursement</h3>
            <p>Insurance companies require documentation that demonstrates medical necessity. Without proper documentation, claims may be denied.</p>
            
            <h3>4. Quality Care</h3>
            <p>The process of documenting sessions helps you organize your clinical thinking and track patterns over time.</p>
            
            <h3>Common Documentation Mistakes</h3>
            <ul>
              <li><strong>Too vague:</strong> "Client discussed feelings" doesn't demonstrate medical necessity</li>
              <li><strong>Too detailed:</strong> Word-for-word transcripts are time-consuming</li>
              <li><strong>Missing key elements:</strong> Forgetting risk assessment</li>
              <li><strong>Delayed:</strong> Completing notes weeks after sessions</li>
            </ul>
            
            <h3>What You'll Learn</h3>
            <ul>
              <li>Understanding "medical necessity"</li>
              <li>Writing clear, concise progress notes</li>
              <li>Documenting functional impairment</li>
              <li>Using efficient note formats (SOAP, DAP, BIRP)</li>
            </ul>
          `,
          duration: 15,
          order: 1,
          isFree: true
        }
      },
      'ethics-in-telehealth': {
        'modules.0.lessons.0': {
          title: 'Welcome & Overview',
          type: 'text',
          content: `
            <h2>Welcome to Ethics in Telehealth Practice</h2>
            <p>Welcome to this comprehensive course on ethical practice in telehealth counseling. This 3-hour course will provide you with the knowledge and tools to practice ethically and effectively online.</p>
            
            <h3>What You'll Learn</h3>
            
            <h4>Module 1: Introduction to Telehealth Ethics</h4>
            <ul>
              <li>Overview of telehealth in mental health</li>
              <li>HIPAA compliance for virtual sessions</li>
              <li>Technology requirements and platform selection</li>
              <li>Setting up a secure virtual office</li>
            </ul>
            
            <h4>Module 2: Informed Consent & Boundaries</h4>
            <ul>
              <li>Elements of telehealth informed consent</li>
              <li>Documentation requirements</li>
              <li>Maintaining therapeutic boundaries virtually</li>
            </ul>
            
            <h4>Module 3: Emergency Protocols</h4>
            <ul>
              <li>Creating safety plans for virtual clients</li>
              <li>Crisis assessment remotely</li>
              <li>Coordinating with emergency services</li>
            </ul>
            
            <h3>CE Credit Information</h3>
            <p><strong>Credit Hours:</strong> 3 hours of Ethics CE<br>
            <strong>NBCC Approved:</strong> Course Provider #7760<br>
            <strong>Requirements:</strong> Complete all lessons and pass final quiz (80%)</p>
            
            <p><strong>Ready to begin? Click "Next" to start learning!</strong></p>
          `,
          duration: 10,
          order: 1,
          isFree: true
        },
        'modules.0.lessons.1': {
          title: 'HIPAA in Telehealth',
          type: 'text',
          content: `
            <h2>HIPAA Compliance in Telehealth Settings</h2>
            <p>HIPAA applies to telehealth just as it does to in-person services. However, conducting therapy online introduces new risks for protecting client privacy.</p>
            
            <h3>HIPAA Basics Review</h3>
            
            <h4>1. Privacy Rule</h4>
            <p>Protects individually identifiable health information (PHI). In telehealth, this includes:</p>
            <ul>
              <li>Video and audio recordings of sessions</li>
              <li>Chat messages and emails</li>
              <li>Electronic health records</li>
              <li>Appointment scheduling information</li>
            </ul>
            
            <h4>2. Security Rule</h4>
            <p>Requires safeguards to protect electronic PHI:</p>
            <ul>
              <li><strong>Access controls:</strong> Passwords, two-factor authentication</li>
              <li><strong>Encryption:</strong> Data encrypted in transit and at rest</li>
              <li><strong>Device security:</strong> Secure computers and phones</li>
            </ul>
            
            <h3>Platform Requirements</h3>
            <p>A HIPAA-compliant platform must:</p>
            <ul>
              <li>Offer end-to-end encryption</li>
              <li>Sign a Business Associate Agreement (BAA)</li>
              <li>Not record without your control</li>
              <li>Provide adequate security</li>
            </ul>
            
            <p><strong>❌ NOT HIPAA-Compliant:</strong> Skype, FaceTime, Facebook Messenger</p>
            <p><strong>✅ CAN Be HIPAA-Compliant:</strong> Zoom for Healthcare, Doxy.me, SimplePractice (with BAA)</p>
            
            <h3>Your Environment</h3>
            <p>Ensure privacy from your location:</p>
            <ul>
              <li>Private room with locked door</li>
              <li>Headphones to prevent others from hearing</li>
              <li>Screen positioned so others can't see</li>
              <li>Professional background</li>
            </ul>
            
            <h3>Business Associate Agreements (BAA)</h3>
            <p>Any vendor handling PHI must sign a BAA:</p>
            <ul>
              <li>Video platform providers</li>
              <li>Electronic health record systems</li>
              <li>Email services for client communication</li>
              <li>Cloud storage providers</li>
            </ul>
            
            <h3>Practical Checklist</h3>
            <ul>
              <li>✓ HIPAA-compliant video platform with BAA</li>
              <li>✓ Encrypted, password-protected devices</li>
              <li>✓ Private, secure location</li>
              <li>✓ Secure internet (not public Wi-Fi)</li>
              <li>✓ Updated telehealth informed consent</li>
              <li>✓ Cyber liability insurance</li>
            </ul>
          `,
          duration: 30,
          order: 2,
          isFree: true
        }
      }
    };
    
    async function updateCourses() {
      const token = localStorage.getItem('token');
      
      if (!token) {
        alert('Please log in first');
        window.location.href = '/login.html';
        return;
      }
      
      const btn = document.getElementById('updateBtn');
      const status = document.getElementById('status');
      const result = document.getElementById('result');
      
      btn.disabled = true;
      btn.textContent = 'Updating...';
      btn.classList.add('opacity-50');
      
      status.innerHTML = '<div class="bg-blue-50 border border-blue-200 rounded-lg p-4"><p class="text-blue-800">Processing updates...</p></div>';
      
      try {
        // Get all courses
        const coursesResponse = await fetch(`${API_URL}/api/courses`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const coursesData = await coursesResponse.json();
        const courses = coursesData.courses;
        
        const updates = [];
        
        // Update each course
        for (const [slug, lessonUpdates] of Object.entries(courseUpdates)) {
          const course = courses.find(c => c.slug === slug);
          if (!course) continue;
          
          // Update lesson content by patching the module
          for (const [path, newContent] of Object.entries(lessonUpdates)) {
            const [_, moduleIdx, __, lessonIdx] = path.split(/[\.\[\]]+/).filter(Boolean);
            
            if (course.modules[moduleIdx] && course.modules[moduleIdx].lessons[lessonIdx]) {
              course.modules[moduleIdx].lessons[lessonIdx] = newContent;
            }
          }
          
          // Save updated course
          const response = await fetch(`${API_URL}/api/admin/courses/${course._id}`, {
            method: 'PUT',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ modules: course.modules })
          });
          
          if (response.ok) {
            updates.push(`✓ Updated ${course.title}`);
          } else {
            updates.push(`✗ Failed to update ${course.title}`);
          }
        }
        
        // Show results
        result.classList.remove('hidden');
        result.innerHTML = `
          <div class="bg-green-50 border border-green-200 rounded-lg p-6">
            <h3 class="font-semibold text-green-900 mb-3">✓ Update Complete!</h3>
            <ul class="text-sm text-green-800 space-y-1 mb-4">
              ${updates.map(u => `<li>${u}</li>`).join('')}
            </ul>
            <p class="text-sm text-green-700 mb-4">Your courses now have real educational content!</p>
            <a href="/courses.html" class="inline-block bg-green-600 hover:bg-green-700 text-white font-semibold px-4 py-2 rounded-lg transition-colors">
              View Courses →
            </a>
          </div>
        `;
        
        status.innerHTML = '';
        btn.classList.add('hidden');
        
      } catch (error) {
        console.error('Update error:', error);
        result.classList.remove('hidden');
        result.innerHTML = `
          <div class="bg-red-50 border border-red-200 rounded-lg p-6">
            <h3 class="font-semibold text-red-900 mb-2">Update Failed</h3>
            <p class="text-sm text-red-700 mb-4">Error: ${error.message}</p>
            <p class="text-sm text-red-600">Try using the MongoDB update method instead.</p>
          </div>
        `;
        btn.disabled = false;
        btn.textContent = 'Try Again';
        btn.classList.remove('opacity-50');
      }
    }
  </script>

<script src="/js/footer.js"></script>
  <div id="cr-footer"></div>
</body>
</html>
