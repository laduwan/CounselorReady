<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Superbill Generator — CounselorReady</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Lato:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--burgundy:#6B1D34;--burgundy-light:#8B3A54;--burgundy-deep:#4A1224;--rose:#D0768A;--green:#4A7C59;--gold:#D4A855;--navy:#284157;--navy-deep:#1A2D3D;--stone:#EDEADF;--cream:#F9F6EF}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Lato',sans-serif;background:var(--stone);color:#2A2A2A;line-height:1.6}
.hdr{background:linear-gradient(145deg,var(--burgundy-deep),var(--burgundy),var(--burgundy-light));padding:14px 28px 12px;border-bottom:2px solid var(--gold)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.logo{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:22px}
.hdr-title{color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.hdr-sub{color:rgba(255,255,255,.5);font-size:11px;margin-top:4px}
.main{max-width:780px;margin:0 auto;padding:24px 20px 60px}
.card{background:#fff;border-radius:14px;border:1px solid #E0DBD0;box-shadow:0 2px 10px rgba(0,0,0,.06);overflow:hidden;margin-bottom:20px}
.card-hdr{padding:16px 24px;border-bottom:1px solid #E0DBD0}
.card-hdr h3{font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;font-weight:700;color:var(--burgundy)}
.card-body{padding:20px 24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px}
.hint{font-size:11px;color:#999;margin-bottom:6px;font-style:italic}
.field input,.field select,.field textarea{width:100%;padding:10px 14px;border-radius:8px;border:1.5px solid #ddd;font-family:'Lato',sans-serif;font-size:14px;outline:none}
.field input:focus,.field select:focus{border-color:var(--green)}
.row{display:flex;gap:14px}
.row .field{flex:1}
.svc-row{display:flex;gap:10px;align-items:center;margin-bottom:8px;padding:8px 12px;background:var(--cream);border-radius:8px}
.svc-row select,.svc-row input{padding:8px 10px;border-radius:6px;border:1.5px solid #ddd;font-family:'Lato',sans-serif;font-size:13px;outline:none}
.svc-row select{flex:2}
.svc-row input{flex:1}
.add-btn{padding:8px 16px;border-radius:8px;border:1.5px dashed #bbb;background:#fff;color:#888;font-size:12px;cursor:pointer;font-family:'Lato',sans-serif;width:100%;text-align:center;transition:.15s}
.add-btn:hover{border-color:var(--green);color:var(--green)}
.del-btn{width:28px;height:28px;border-radius:50%;border:none;background:rgba(107,29,52,.08);color:var(--burgundy);font-size:16px;cursor:pointer;flex-shrink:0}
.btn{padding:12px;border-radius:8px;font-family:'Lato',sans-serif;font-size:14px;font-weight:700;cursor:pointer;border:none;width:100%;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-gen{background:linear-gradient(135deg,var(--gold),#C49A40);color:var(--burgundy-deep);box-shadow:0 2px 8px rgba(212,168,85,.3)}
/* SUPERBILL OUTPUT */
.sb{font-size:13px;line-height:1.6}
.sb table{width:100%;border-collapse:collapse;margin:10px 0}
.sb th,.sb td{padding:8px 12px;text-align:left;border:1px solid #D5CFC0}
.sb th{background:rgba(107,29,52,.04);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--burgundy)}
.sb .total-row td{font-weight:700;background:rgba(212,168,85,.06);font-size:14px}
.sb h4{font-size:13px;font-weight:700;color:var(--navy);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.5px}
.output{background:#fff;border-radius:14px;border:1px solid #D5CFC0;overflow:hidden;box-shadow:0 3px 14px rgba(0,0,0,.08);margin-top:20px}
.output-hdr{background:linear-gradient(135deg,var(--burgundy-deep),var(--burgundy));padding:16px 24px;color:#fff}
.output-hdr h3{font-family:'Cormorant Garamond',Georgia,serif;font-size:18px}
.output-body{padding:24px}
.output-actions{display:flex;gap:10px;padding:14px 24px;background:var(--cream);border-top:1px solid #E0DBD0}
.act-btn{flex:1;padding:10px;border-radius:8px;font-family:'Lato',sans-serif;font-size:13px;font-weight:700;cursor:pointer;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;border:none}
.act-print{background:var(--navy);color:#D8E4EE}
.act-copy{background:#fff;color:var(--navy);border:1.5px solid #D5CFC0}
.privacy{text-align:center;font-size:11px;color:#aaa;margin-top:16px;line-height:1.5}
.footer{text-align:center;padding:20px;font-size:12px;color:#999;line-height:1.7;margin-top:20px;background:var(--navy-deep);border-radius:12px}
@media(max-width:600px){.row{flex-direction:column;gap:0}.svc-row{flex-wrap:wrap}}
@media print{.hdr,.card,.output-actions,.privacy,.footer{display:none!important}.output{box-shadow:none;border:1px solid #ccc}.output-hdr{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
<script src="/js/cr-gtag.js"></script>
<script>!function(t,e){var o,n,p,r;e.__SV||(window.posthog=e,e._i=[],e.init=function(i,s,a){function g(t,e){var o=e.split(".");2==o.length&&(t=t[o[0]],e=o[1]),t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}}(p=t.createElement("script")).type="text/javascript",p.crossOrigin="anonymous",p.async=!0,p.src=s.api_host.replace(".i.posthog.com","-assets.i.posthog.com")+"/static/array.js",(r=t.getElementsByTagName("script")[0]).parentNode.insertBefore(p,r);var u=e;for(a!==void 0?u=e[a]=[]:a="posthog",u.people=u.people||[],u.toString=function(t){var e="posthog";return a!="posthog"&&(e+="."+a),t||(e+=" (stub)"),e},u.people.toString=function(){return u.toString(1)+" (stub)"},o="capture identify alias people.set people.set_once set_config register register_once unregister opt_out_capturing has_opted_out_capturing opt_in_capturing reset isFeatureEnabled onFeatureFlags getFeatureFlag getFeatureFlagPayload reloadFeatureFlags group updateEarlyAccessFeatureEnrollment getEarlyAccessFeatures getActiveMatchingSurveys getSurveys onSessionId".split(" "),n=0;n<o.length;n++)g(u,o[n]);e._i.push([i,s,a])},e.__SV=1)}(document,window.posthog||[]);posthog.init("phc_rRGb8TPVl8lDYnD4M2HMGGuBBkL9whGzghD5FEX20Vb",{api_host:"https://us.i.posthog.com",autocapture:false});</script>
</head>
<body>
<div class="hdr">
<div class="hdr-top"><span class="logo"><span style="color:#D0768A">Counselor</span><span style="color:#5A9469">Ready</span></span><span style="background:var(--green);color:#fff;font-size:10px;font-weight:700;padding:3px 10px;border-radius:4px;letter-spacing:.8px">FREE TOOL</span></div>
<div class="hdr-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D4A855" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Superbill Generator</div>
<div class="hdr-sub">Generate a clean, insurance-ready superbill for out-of-network reimbursement.</div>
</div>
<main class="main" id="app"></main>
<script>
const CPTS=[
{code:"90791",desc:"Psychiatric Diagnostic Evaluation",fee:200},
{code:"90834",desc:"Individual Psychotherapy, 38 min",fee:130},
{code:"90837",desc:"Individual Psychotherapy, 53 min",fee:160},
{code:"90846",desc:"Family Psychotherapy w/o Patient",fee:160},
{code:"90847",desc:"Family Psychotherapy w/ Patient",fee:160},
{code:"90853",desc:"Group Psychotherapy",fee:75},
{code:"96130",desc:"Psychological Testing, First Hour",fee:200},
{code:"96131",desc:"Psychological Testing, Add'l Hour",fee:180},
{code:"90832",desc:"Individual Psychotherapy, 16 min",fee:80},
{code:"90839",desc:"Crisis Psychotherapy, First 60 min",fee:200},
{code:"90840",desc:"Crisis Psychotherapy, Add'l 30 min",fee:100},
];

let D={
  provName:"",provCreds:"",provNPI:"",provTaxID:"",provAddr:"",provPhone:"",provLicense:"",
  cliName:"",cliDOB:"",cliID:"",cliAddr:"",
  dateOfSvc:new Date().toISOString().split('T')[0],
  placeOfSvc:"11",
  dx1:"",dx2:"",dx3:"",
  services:[{cpt:"90837",mod:"",units:"1",fee:"160"}],
};

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function addSvc(){D.services.push({cpt:"90834",mod:"",units:"1",fee:"130"});render()}
function delSvc(i){if(D.services.length>1){D.services.splice(i,1);render()}}
function updSvc(i,k,v){D.services[i][k]=v;if(k==='cpt'){const c=CPTS.find(x=>x.code===v);if(c)D.services[i].fee=String(c.fee)}render()}

function render(){
  let svcHTML=D.services.map((s,i)=>`
  <div class="svc-row">
    <select onchange="updSvc(${i},'cpt',this.value)">
      ${CPTS.map(c=>`<option value="${c.code}" ${s.cpt===c.code?'selected':''}>${c.code} — ${c.desc}</option>`).join('')}
    </select>
    <input style="flex:0 0 60px" value="${esc(s.mod)}" oninput="D.services[${i}].mod=this.value" placeholder="Mod" title="Modifier (e.g. 95 for telehealth)">
    <input style="flex:0 0 50px" type="number" value="${s.units}" min="1" oninput="D.services[${i}].units=this.value" title="Units">
    <input style="flex:0 0 80px" type="number" value="${s.fee}" oninput="D.services[${i}].fee=this.value" title="Fee ($)">
    <button class="del-btn" onclick="delSvc(${i})" title="Remove">&times;</button>
  </div>`).join('');

  document.getElementById('app').innerHTML=`
  <div class="card"><div class="card-hdr"><h3>Provider Information</h3></div><div class="card-body">
    <div class="row"><div class="field"><label>Provider Name</label><input value="${esc(D.provName)}" oninput="D.provName=this.value" placeholder="e.g. Jane Smith, LPC"></div><div class="field"><label>Credentials</label><input value="${esc(D.provCreds)}" oninput="D.provCreds=this.value" placeholder="e.g. LPC, NCC"></div></div>
    <div class="row"><div class="field"><label>NPI Number</label><input value="${esc(D.provNPI)}" oninput="D.provNPI=this.value" placeholder="10-digit NPI"></div><div class="field"><label>Tax ID / EIN</label><input value="${esc(D.provTaxID)}" oninput="D.provTaxID=this.value" placeholder="XX-XXXXXXX"></div></div>
    <div class="row"><div class="field"><label>License Number</label><input value="${esc(D.provLicense)}" oninput="D.provLicense=this.value" placeholder="e.g. LPC009587"></div><div class="field"><label>Phone</label><input value="${esc(D.provPhone)}" oninput="D.provPhone=this.value" placeholder="(404) 555-0123"></div></div>
    <div class="field"><label>Practice Address</label><input value="${esc(D.provAddr)}" oninput="D.provAddr=this.value" placeholder="123 Peachtree St, Suite 200, Atlanta, GA 30301"></div>
  </div></div>

  <div class="card"><div class="card-hdr"><h3>Client Information</h3></div><div class="card-body">
    <div class="row"><div class="field"><label>Client Name</label><input value="${esc(D.cliName)}" oninput="D.cliName=this.value" placeholder="Full legal name"></div><div class="field"><label>Date of Birth</label><input type="date" value="${esc(D.cliDOB)}" oninput="D.cliDOB=this.value"></div></div>
    <div class="row"><div class="field"><label>Client ID / Insurance ID</label><input value="${esc(D.cliID)}" oninput="D.cliID=this.value" placeholder="Insurance member ID or N/A"></div><div class="field"><label>Client Address</label><input value="${esc(D.cliAddr)}" oninput="D.cliAddr=this.value" placeholder="Client mailing address"></div></div>
  </div></div>

  <div class="card"><div class="card-hdr"><h3>Service Details</h3></div><div class="card-body">
    <div class="row">
      <div class="field"><label>Date of Service</label><input type="date" value="${esc(D.dateOfSvc)}" oninput="D.dateOfSvc=this.value"></div>
      <div class="field"><label>Place of Service</label><select onchange="D.placeOfSvc=this.value">
        <option value="11" ${D.placeOfSvc==='11'?'selected':''}>11 — Office</option>
        <option value="10" ${D.placeOfSvc==='10'?'selected':''}>10 — Telehealth (Patient Home)</option>
        <option value="02" ${D.placeOfSvc==='02'?'selected':''}>02 — Telehealth (Other)</option>
        <option value="12" ${D.placeOfSvc==='12'?'selected':''}>12 — Home</option>
        <option value="99" ${D.placeOfSvc==='99'?'selected':''}>99 — Other</option>
      </select></div>
    </div>
    <div class="row">
      <div class="field"><label>Diagnosis 1 (ICD-10)</label><input value="${esc(D.dx1)}" oninput="D.dx1=this.value" placeholder="e.g. F33.1"></div>
      <div class="field"><label>Diagnosis 2</label><input value="${esc(D.dx2)}" oninput="D.dx2=this.value" placeholder="e.g. F41.1"></div>
      <div class="field"><label>Diagnosis 3</label><input value="${esc(D.dx3)}" oninput="D.dx3=this.value" placeholder="Optional"></div>
    </div>
    <div class="field"><label>Services Rendered</label>
      <div class="hint">Select CPT code, modifier (95 for telehealth), units, and fee. Click + to add more lines.</div>
      ${svcHTML}
      <button class="add-btn" onclick="addSvc()">+ Add Service Line</button>
    </div>
    <button class="btn btn-gen" onclick="generate()" style="margin-top:12px">Generate Superbill</button>
  </div></div>

  <div id="sbOutput"></div>
  <div style="background:rgba(40,65,87,.04);border:1px solid rgba(40,65,87,.1);border-radius:10px;padding:12px 16px;margin-top:16px;font-size:12px;color:#666;line-height:1.7"><strong style="color:#284157">This is a clinical tool, not an EHR.</strong> Print or save this superbill for your records. CounselorReady does not store any data you enter. <a href="/tools/" style="color:#284157;font-weight:600">Record-keeping guidance →</a></div>
  <div class="privacy">CounselorReady does not capture, transmit, or retain any information entered here.</div>
  <div class="footer"><span style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:16px"><span style="color:var(--rose)">Counselor</span><span style="color:#5A9469">Ready</span></span> — Free clinical tools.<br>&copy; 2026 GAITP LLC. All rights reserved. | NBCC ACEP Provider #7760</div>`;
}

function generate(){if(window.posthog)posthog.capture('tool_used',{tool:'superbill'});
  const total=D.services.reduce((s,svc)=>s+parseFloat(svc.fee||0)*parseInt(svc.units||1),0);
  const today=new Date().toLocaleDateString();
  const posLabels={'11':'Office','10':'Telehealth (Patient Home)','02':'Telehealth (Other)','12':'Home','99':'Other'};
  const dxList=[D.dx1,D.dx2,D.dx3].filter(Boolean);

  let svcRows=D.services.map(s=>{
    const c=CPTS.find(x=>x.code===s.cpt);
    const lineTotal=parseFloat(s.fee||0)*parseInt(s.units||1);
    return `<tr><td>${esc(D.dateOfSvc)}</td><td>${esc(D.placeOfSvc)}</td><td>${esc(s.cpt)}</td><td>${c?esc(c.desc):''}</td><td>${esc(s.mod)||'—'}</td><td>${dxList.map((_,i)=>i+1).join(',')}</td><td style="text-align:center">${s.units}</td><td style="text-align:right">$${parseFloat(s.fee).toFixed(2)}</td><td style="text-align:right;font-weight:700">$${lineTotal.toFixed(2)}</td></tr>`;
  }).join('');

  document.getElementById('sbOutput').innerHTML=`
  <div class="output">
    <div class="output-hdr"><h3>Superbill / Statement for Insurance Reimbursement</h3></div>
    <div class="output-body sb" id="sbBody">
      <div style="display:flex;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:16px">
        <div>
          <h4>Provider</h4>
          <strong>${esc(D.provName)}${D.provCreds?', '+esc(D.provCreds):''}</strong><br>
          NPI: ${esc(D.provNPI)||'__________'} | Tax ID: ${esc(D.provTaxID)||'__________'}<br>
          License: ${esc(D.provLicense)||'__________'}<br>
          ${esc(D.provAddr)}<br>
          ${esc(D.provPhone)}
        </div>
        <div style="text-align:right">
          <h4>Client</h4>
          <strong>${esc(D.cliName)||'__________'}</strong><br>
          DOB: ${esc(D.cliDOB)||'__________'}<br>
          ID: ${esc(D.cliID)||'N/A'}<br>
          ${esc(D.cliAddr)}
        </div>
      </div>

      <h4>Diagnosis</h4>
      <table><tr>${dxList.map((d,i)=>`<th>Dx ${i+1}</th>`).join('')}</tr>
      <tr>${dxList.map(d=>`<td style="font-weight:700">${esc(d)}</td>`).join('')}</tr></table>

      <h4>Services</h4>
      <table>
        <tr><th>Date</th><th>POS</th><th>CPT</th><th>Description</th><th>Mod</th><th>Dx Ptr</th><th>Units</th><th style="text-align:right">Fee</th><th style="text-align:right">Total</th></tr>
        ${svcRows}
        <tr class="total-row"><td colspan="8" style="text-align:right"><strong>Total Charges:</strong></td><td style="text-align:right">$${total.toFixed(2)}</td></tr>
      </table>

      <div style="margin-top:20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px">
        <div>
          <h4>Provider Signature</h4>
          <div style="margin-top:8px">_________________________________<br><span style="font-size:11px;color:#999">${esc(D.provName)} | Date: __________</span></div>
        </div>
        <div>
          <h4>Payment Information</h4>
          <div style="font-size:12px;color:#666">Amount Paid: $__________ <br>Payment Method: ☐ Cash ☐ Check ☐ Card<br>Balance Due: $__________</div>
        </div>
      </div>

      <div style="margin-top:16px;padding-top:12px;border-top:1px solid #E0DBD0;font-size:11px;color:#999;text-align:center">
        This superbill is provided for out-of-network insurance reimbursement. Client is responsible for submitting to their insurance carrier. Reimbursement is not guaranteed and depends on the client's individual plan benefits.
      </div>
    </div>
    <div class="output-actions">
      <button class="act-btn act-print" onclick="printSB()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> Print</button>
      <button class="act-btn act-copy" onclick="copySB()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy</button>
    </div>
  </div>`;
  document.getElementById('sbOutput').scrollIntoView({behavior:'smooth'});
}

function printSB(){const b=document.getElementById('sbBody');const w=window.open('','','width=800,height=1000');w.document.write('<html><head><title>Superbill</title><style>body{font-family:Arial,sans-serif;padding:32px;font-size:12px;color:#222}table{width:100%;border-collapse:collapse;margin:8px 0}th,td{padding:6px 10px;border:1px solid #ccc;text-align:left}th{background:#f5f0f2;font-size:10px;text-transform:uppercase}h4{font-size:12px;margin:12px 0 4px;text-transform:uppercase;color:#6B1D34}.total-row td{font-weight:700;background:#faf5e8}</style></head><body>'+b.innerHTML+'</body></html>');w.document.close();w.print()}
function copySB(){navigator.clipboard.writeText(document.getElementById('sbBody').innerText).then(()=>{const b=document.querySelector('.act-copy');const o=b.innerHTML;b.innerHTML='Copied!';setTimeout(()=>b.innerHTML=o,2000)})}

render();
</script>
<!-- CR Email Capture -->
<div id="crEmailCapture" style="display:none"></div>
<script>
(function(){
  const API='https://api.counselorready.com';
  const KEY='cr_email_captured';
  const DISMISS_KEY='cr_email_dismissed';
  const SHOW_AFTER=1;
  let uses=parseInt(sessionStorage.getItem('cr_tool_uses')||'0');
  function trackUse(){uses++;sessionStorage.setItem('cr_tool_uses',String(uses));maybeShow()}
  window.crTrackToolUse=trackUse;
  function maybeShow(){
    if(localStorage.getItem(KEY)||localStorage.getItem(DISMISS_KEY))return;
    if(uses<SHOW_AFTER)return;
    render();
  }
  function render(){
    const el=document.getElementById('crEmailCapture');
    if(!el)return;
    el.style.display='block';
    el.innerHTML=`
    <div style="background:linear-gradient(135deg,#1A2D3D,#284157);border-radius:14px;padding:24px;margin:20px 0;text-align:center;position:relative;box-shadow:0 4px 16px rgba(26,45,61,.3)">
      <button onclick="document.getElementById('crEmailCapture').style.display='none';localStorage.setItem('${DISMISS_KEY}','1')" style="position:absolute;top:10px;right:14px;background:none;border:none;color:rgba(255,255,255,.3);font-size:18px;cursor:pointer">&times;</button>
      <div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;font-weight:700;color:#fff;margin-bottom:6px">Want more tools like this?</div>
      <p style="font-size:13px;color:#8AABBE;margin-bottom:16px;line-height:1.5;max-width:440px;margin-left:auto;margin-right:auto">Get notified when we release new free clinical tools, CE course drops, and practice-building resources. No spam — just useful stuff for clinicians.</p>
      <div style="display:flex;gap:10px;max-width:420px;margin:0 auto">
        <input id="crEmailInput" type="email" placeholder="you@example.com" style="flex:1;padding:11px 14px;border-radius:8px;border:2px solid #35546B;background:#1A2D3D;color:#E8E8E8;font-family:'Lato',sans-serif;font-size:14px;outline:none">
        <button onclick="crSubmitEmail()" style="padding:11px 20px;background:linear-gradient(135deg,#D4A855,#C49A40);color:#4A1224;border:none;border-radius:8px;font-family:'Lato',sans-serif;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap">Keep Me Posted</button>
      </div>
      <div id="crEmailMsg" style="font-size:12px;margin-top:8px;min-height:18px"></div>
      <div style="font-size:10px;color:rgba(255,255,255,.25);margin-top:8px">No spam. Unsubscribe anytime. We respect your inbox.</div>
    </div>`;
  }
  window.crSubmitEmail=async function(){
    const input=document.getElementById('crEmailInput');
    const msg=document.getElementById('crEmailMsg');
    const email=input.value.trim();
    if(!email||!email.includes('@')){msg.style.color='#E8A87C';msg.textContent='Please enter a valid email.';return}
    msg.style.color='#8AABBE';msg.textContent='Saving...';
    try{
      const r=await fetch(API+'/api/tools/capture-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,source:document.title})});
      if(r.ok){
        msg.style.color='#5A9469';msg.textContent="You're in! Watch your inbox.";
        localStorage.setItem(KEY,email);
        setTimeout(()=>{document.getElementById('crEmailCapture').style.display='none'},2500);
      } else {
        const d=await r.json();
        msg.style.color='#5A9469';msg.textContent=d.message||"You're already subscribed!";
        localStorage.setItem(KEY,email);
      }
    }catch(e){
      localStorage.setItem(KEY,email);
      msg.style.color='#5A9469';msg.textContent="Saved! We'll be in touch.";
    }
  };
  setTimeout(maybeShow,3000);
})();
</script>
<!-- /CR Email Capture -->
