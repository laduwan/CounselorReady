<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Active Users - CounselorReady Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/design-tokens.css">
  <link rel="stylesheet" href="/css/typography.css">
  <link rel="stylesheet" href="/css/cr-tailwind.min.css">

  <style>
    body{background:#F8F7F4; font-family: 'Lato', system-ui, sans-serif; }
    .font-display { font-family: 'Cormorant Garamond', Georgia, serif; }
    .spin { animation: cr-spin 0.8s linear infinite; }
    @keyframes cr-spin { to { transform: rotate(360deg); } }
  </style>
<script src="/js/cr-gtag.js"></script>
</head>
<body class="bg-stone-50 min-h-screen">

  <div id="cr-header"></div>
  <script src="/shared/nav-footer.js"></script>

  <!-- Admin Header -->
  <header class="bg-burgundy-800 text-white sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <div class="w-9 h-9 bg-burgundy-800 rounded-lg flex items-center justify-center relative overflow-hidden">
          <span class="font-display font-bold text-gold-400 absolute" style="font-size:16px;top:2px;left:5px;">C</span>
          <span class="font-display font-bold text-forest-400 absolute" style="font-size:16px;bottom:2px;left:13px;">R</span>
        </div>
        <div>
          <span class="font-display font-semibold text-lg">
            <span style="color:#f2a8be">Counselor</span><span style="color:#98c3a9">Ready</span>
          </span>
          <span class="ml-2 text-xs bg-gold-500 text-white px-2 py-0.5 rounded-full font-semibold">ADMIN</span>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <span class="text-burgundy-200 text-sm" id="adminEmail">Admin</span>
        <a href="/admin.html" class="text-burgundy-200 hover:text-white text-sm flex items-center gap-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          Admin Hub
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-6">

    <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
      <div>
        <h1 class="font-display text-2xl font-semibold text-burgundy-900">Active Users</h1>
        <p class="text-sm text-stone-500">Live snapshot of who's on the platform — check before you deploy.</p>
      </div>
      <div class="flex items-center gap-3">
        <span id="lastUpdated" class="text-xs text-stone-400"></span>
        <button id="refreshBtn" onclick="fetchActiveUsers()" class="flex items-center gap-2 px-4 py-2 bg-white border border-stone-300 rounded-lg text-sm font-medium text-stone-700 hover:bg-stone-50 transition-colors">
          <svg id="refreshIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          Refresh
        </button>
      </div>
    </div>

    <!-- Status banner -->
    <div id="statusBanner" class="rounded-xl border p-5 mb-8 flex items-center gap-4">
      <svg class="w-8 h-8 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <div>
        <div id="statusHeadline" class="font-display text-xl font-semibold">Loading…</div>
        <div id="statusSubtext" class="text-sm opacity-80"></div>
      </div>
    </div>

    <!-- Online Now -->
    <div class="bg-white rounded-xl border border-stone-200 mb-8">
      <div class="px-5 py-4 border-b border-stone-100 flex items-center gap-2">
        <svg class="w-4 h-4 text-forest-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <h2 class="font-semibold text-stone-800">Online Now</h2>
        <span id="onlineCountBadge" class="ml-1 text-xs bg-forest-100 text-forest-700 px-2 py-0.5 rounded-full font-semibold">0</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-left text-stone-500 border-b border-stone-100">
              <th class="px-5 py-2 font-medium">Name</th>
              <th class="px-5 py-2 font-medium">Email</th>
              <th class="px-5 py-2 font-medium">Plan</th>
              <th class="px-5 py-2 font-medium">Active For</th>
              <th class="px-5 py-2 font-medium">Last Activity</th>
            </tr>
          </thead>
          <tbody id="onlineTableBody">
            <tr><td colspan="5" class="px-5 py-6 text-center text-stone-400">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Recently Active -->
    <div class="bg-white rounded-xl border border-stone-200">
      <div class="px-5 py-4 border-b border-stone-100 flex items-center gap-2">
        <svg class="w-4 h-4 text-stone-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <h2 class="font-semibold text-stone-800">Recently Active (24h)</h2>
        <span id="recentCountBadge" class="ml-1 text-xs bg-stone-100 text-stone-600 px-2 py-0.5 rounded-full font-semibold">0</span>
      </div>
      <ul id="recentList" class="divide-y divide-stone-100">
        <li class="px-5 py-6 text-center text-stone-400 text-sm">Loading…</li>
      </ul>
    </div>

  </main>

  <script>
    const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:5000' : 'https://api.counselorready.com';
    const token = localStorage.getItem('token');
    const currentUser = JSON.parse(localStorage.getItem('user') || '{}');

    let refreshTimer = null;
    let tickTimer = null;
    let lastData = null;

    document.addEventListener('DOMContentLoaded', () => {
      checkAuth();
      fetchActiveUsers();
      refreshTimer = setInterval(fetchActiveUsers, 60000);
      tickTimer = setInterval(updateElapsedTimes, 1000);
    });

    function checkAuth() {
      if (!token || currentUser.role !== 'admin') {
        alert('Admin access required');
        window.location.href = '/dashboard.html';
        return;
      }
      document.getElementById('adminEmail').textContent = currentUser.email || 'Admin';
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }

    function formatDuration(minutes) {
      const total = Math.max(0, Math.round(minutes));
      const h = Math.floor(total / 60);
      const m = total % 60;
      return `${h}:${String(m).padStart(2, '0')}`;
    }

    function formatRelative(dateStr) {
      if (!dateStr) return '—';
      const diffMs = Date.now() - new Date(dateStr).getTime();
      const mins = Math.max(0, Math.round(diffMs / 60000));
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      return `${Math.floor(hrs / 24)}d ago`;
    }

    async function fetchActiveUsers() {
      const btn = document.getElementById('refreshBtn');
      const icon = document.getElementById('refreshIcon');
      icon.classList.add('spin');
      try {
        const response = await fetch(`${API_URL}/api/admin/active-users`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        lastData = data;
        render(data);
        document.getElementById('lastUpdated').textContent = `Updated ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        console.error('Failed to load active users:', err);
        document.getElementById('lastUpdated').textContent = 'Update failed';
      } finally {
        icon.classList.remove('spin');
      }
    }

    function render(data) {
      renderBanner(data);
      renderOnlineTable(data);
      renderRecentList(data);
    }

    function renderBanner(data) {
      const nonAdminOnline = (data.onlineNow || []).filter(u => u.role !== 'admin');
      const banner = document.getElementById('statusBanner');
      const headline = document.getElementById('statusHeadline');
      const subtext = document.getElementById('statusSubtext');

      if (nonAdminOnline.length === 0) {
        banner.className = 'rounded-xl border border-forest-200 bg-forest-50 p-5 mb-8 flex items-center gap-4 text-forest-800';
        headline.textContent = 'Safe to deploy — no members active';
        subtext.textContent = 'No non-admin members are currently online.';
      } else {
        banner.className = 'rounded-xl border border-burgundy-200 bg-burgundy-50 p-5 mb-8 flex items-center gap-4 text-burgundy-800';
        headline.textContent = `${nonAdminOnline.length} member${nonAdminOnline.length === 1 ? '' : 's'} active — hold off`;
        subtext.textContent = 'Deploying now may interrupt an active session.';
      }
    }

    function renderOnlineTable(data) {
      const rows = data.onlineNow || [];
      document.getElementById('onlineCountBadge').textContent = rows.length;
      const body = document.getElementById('onlineTableBody');

      if (rows.length === 0) {
        body.innerHTML = '<tr><td colspan="5" class="px-5 py-6 text-center text-stone-400">No one online right now</td></tr>';
        return;
      }

      body.innerHTML = rows.map(u => `
        <tr class="border-b border-stone-50 last:border-0">
          <td class="px-5 py-3 font-medium text-stone-800">${escapeHtml(u.name)}${u.role === 'admin' ? ' <span class=\"text-xs text-burgundy-500\">(admin)</span>' : ''}</td>
          <td class="px-5 py-3 text-stone-600">${escapeHtml(u.email)}</td>
          <td class="px-5 py-3 text-stone-600 capitalize">${escapeHtml(u.plan || 'free')}</td>
          <td class="px-5 py-3 text-stone-600 font-mono elapsed-cell" data-session-start="${escapeHtml(u.sessionStartAt)}">${formatDuration((Date.now() - new Date(u.sessionStartAt).getTime()) / 60000)}</td>
          <td class="px-5 py-3 text-stone-500">${formatRelative(u.lastActiveAt)}</td>
        </tr>
      `).join('');
    }

    function renderRecentList(data) {
      const rows = data.recent || [];
      document.getElementById('recentCountBadge').textContent = rows.length;
      const list = document.getElementById('recentList');

      if (rows.length === 0) {
        list.innerHTML = '<li class="px-5 py-6 text-center text-stone-400 text-sm">No other activity in the last 24 hours</li>';
        return;
      }

      list.innerHTML = rows.map(u => `
        <li class="px-5 py-3 flex items-center justify-between text-sm">
          <div>
            <span class="font-medium text-stone-800">${escapeHtml(u.name)}</span>
            <span class="text-stone-500 ml-2">${escapeHtml(u.email)}</span>
          </div>
          <span class="text-stone-400">${formatRelative(u.lastActiveAt)}</span>
        </li>
      `).join('');
    }

    function updateElapsedTimes() {
      document.querySelectorAll('.elapsed-cell').forEach(cell => {
        const start = cell.getAttribute('data-session-start');
        if (!start) return;
        const minutes = (Date.now() - new Date(start).getTime()) / 60000;
        cell.textContent = formatDuration(minutes);
      });
    }
  </script>
</body>
</html>
