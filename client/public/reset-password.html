<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Reset Password - CounselorReady</title>
  <link rel="stylesheet" href="/css/design-tokens.css">
  <link rel="stylesheet" href="/css/typography.css">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/js/tailwind-config.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <style>
    body{background:#F8F7F4; font-family: 'Lato', system-ui, sans-serif; }
    .font-display { font-family: 'Cormorant Garamond', Georgia, serif; }
  </style>
<script src="/js/cr-gtag.js"></script>
</head>
<body class="bg-stone-50 min-h-screen flex flex-col">
  
  <!-- Header -->
  <header class="border-b border-hunter-100 bg-white/80 backdrop-blur-sm">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-xl flex items-center justify-center" style="background: linear-gradient(135deg, #8b2542, #6b1d34); shadow-lg shadow-forest-900/20">
          <span class="font-display font-bold text-xl" style="position: relative; display: inline-block; width: 28px; height: 28px;"><span style="color: #D4A855; position: absolute; top: -4px; left: 0;">C</span><span style="color: #4A7C59; position: absolute; top: 6px; left: 8px;">R</span></span>
        </div>
        <div class="flex flex-col">
          <span class="font-display font-semibold text-2xl tracking-wide">
            <span class="text-burgundy-800">Counselor</span><span class="text-hunter-600">Ready</span>
          </span>
        </div>
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      
      <!-- Card -->
      <div class="bg-white rounded-2xl shadow-xl shadow-burgundy-900/10 p-8 border border-burgundy-100">
        
        <!-- Icon -->
        <div class="w-16 h-16 bg-gradient-to-br from-burgundy-800 to-forest-800 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg">
          <svg class="w-8 h-8 text-gold-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </div>

        <h1 class="font-display text-3xl font-semibold text-burgundy-900 text-center mb-2">
          Reset Password
        </h1>
        <p class="text-forest-600 text-center mb-8">
          Enter your new password below.
        </p>

        <!-- Form -->
        <form id="resetPasswordForm" class="space-y-6">
          <div>
            <label for="password" class="block text-sm font-medium text-forest-700 mb-2">
              New Password
            </label>
            <div class="relative">
              <input 
                type="password" 
                id="password" 
                name="password" 
                required
                minlength="8"
                placeholder="••••••••"
                class="w-full px-4 py-3 border border-forest-200 rounded-xl focus:ring-2 focus:ring-burgundy-500 focus:border-burgundy-500 transition-all outline-none pr-12"
              >
              <button 
                type="button" 
                onclick="togglePassword('password')"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-forest-400 hover:text-forest-600"
              >
                <svg id="password-eye" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              </button>
            </div>
            <p class="text-xs text-forest-500 mt-1">Must be at least 8 characters</p>
          </div>

          <div>
            <label for="confirmPassword" class="block text-sm font-medium text-forest-700 mb-2">
              Confirm New Password
            </label>
            <div class="relative">
              <input 
                type="password" 
                id="confirmPassword" 
                name="confirmPassword" 
                required
                minlength="8"
                placeholder="••••••••"
                class="w-full px-4 py-3 border border-forest-200 rounded-xl focus:ring-2 focus:ring-burgundy-500 focus:border-burgundy-500 transition-all outline-none pr-12"
              >
              <button 
                type="button" 
                onclick="togglePassword('confirmPassword')"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-forest-400 hover:text-forest-600"
              >
                <svg id="confirmPassword-eye" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              </button>
            </div>
          </div>

          <button 
            type="submit"
            class="w-full bg-gradient-to-r from-burgundy-800 to-burgundy-700 hover:from-burgundy-900 hover:to-burgundy-800 text-white font-semibold py-3 px-4 rounded-xl transition-all shadow-md hover:shadow-lg"
          >
            Reset Password
          </button>
        </form>

        <!-- Success Message (hidden by default) -->
        <div id="successMessage" class="hidden">
          <div class="bg-forest-50 border border-forest-200 rounded-xl p-6 text-center">
            <div class="w-12 h-12 bg-forest-500 rounded-full flex items-center justify-center mx-auto mb-4">
              <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
              </svg>
            </div>
            <h3 class="font-display text-xl font-semibold text-forest-800 mb-2">Password Reset!</h3>
            <p class="text-forest-600 text-sm mb-4">
              Your password has been successfully reset.
            </p>
            <a 
              href="/login.html" 
              class="inline-block bg-gradient-to-r from-burgundy-800 to-burgundy-700 hover:from-burgundy-900 hover:to-burgundy-800 text-white font-semibold py-2 px-6 rounded-xl transition-all shadow-md hover:shadow-lg"
            >
              Sign In
            </a>
          </div>
        </div>

        <!-- Error Message (hidden by default) -->
        <div id="errorMessage" class="hidden mt-4 bg-red-50 border border-red-200 rounded-xl p-4 text-center">
          <p class="text-red-700 text-sm" id="errorText"></p>
        </div>

        <!-- Invalid Token Message (hidden by default) -->
        <div id="invalidToken" class="hidden">
          <div class="bg-red-50 border border-red-200 rounded-xl p-6 text-center">
            <div class="w-12 h-12 bg-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
              <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </div>
            <h3 class="font-display text-xl font-semibold text-red-800 mb-2">Invalid or Expired Link</h3>
            <p class="text-red-600 text-sm mb-4">
              This password reset link is invalid or has expired.
            </p>
            <a 
              href="/forgot-password.html" 
              class="inline-block bg-gradient-to-r from-burgundy-800 to-burgundy-700 hover:from-burgundy-900 hover:to-burgundy-800 text-white font-semibold py-2 px-6 rounded-xl transition-all shadow-md hover:shadow-lg"
            >
              Request New Link
            </a>
          </div>
        </div>

      </div>

    </div>
  </main>

  <!-- Footer -->

  <script>
    const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:5000' : 'https://api.counselorready.com';
    
    // Get token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    const form = document.getElementById('resetPasswordForm');
    const successMessage = document.getElementById('successMessage');
    const errorMessage = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    const invalidToken = document.getElementById('invalidToken');

    // Check if token exists
    if (!token) {
      form.classList.add('hidden');
      invalidToken.classList.remove('hidden');
    }

    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      const eyeIcon = document.getElementById(inputId + '-eye');
      
      if (input.type === 'password') {
        input.type = 'text';
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
        `;
      } else {
        input.type = 'password';
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
        `;
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const submitBtn = form.querySelector('button[type="submit"]');

      // Validate passwords match
      if (password !== confirmPassword) {
        errorText.textContent = 'Passwords do not match.';
        errorMessage.classList.remove('hidden');
        return;
      }

      // Validate password length
      if (password.length < 8) {
        errorText.textContent = 'Password must be at least 8 characters.';
        errorMessage.classList.remove('hidden');
        return;
      }

      // Hide any previous errors
      errorMessage.classList.add('hidden');
      
      // Disable button and show loading
      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <svg class="animate-spin h-5 w-5 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      `;

      try {
        const response = await fetch(`${API_URL}/api/auth/reset-password`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ token, password }),
        });

        const data = await response.json();

        if (response.ok) {
          // Show success message
          form.classList.add('hidden');
          successMessage.classList.remove('hidden');
          errorMessage.classList.add('hidden');
        } else {
          const errMsg = data.error || data.message || '';
          if (errMsg.toLowerCase().includes('token') || errMsg.toLowerCase().includes('expired')) {
            // Token is invalid or expired
            form.classList.add('hidden');
            invalidToken.classList.remove('hidden');
          } else {
            // Show error
            errorText.textContent = errMsg || 'Something went wrong. Please try again.';
            errorMessage.classList.remove('hidden');
          }
        }
      } catch (error) {
        errorText.textContent = 'Network error. Please try again.';
        errorMessage.classList.remove('hidden');
      }

      // Re-enable button
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Reset Password';
    });
  </script>

<script src="/js/footer.js"></script>
<script src="/shared/nav-footer.js"></script>
<div id="cr-footer"></div>
</body>
</html>
