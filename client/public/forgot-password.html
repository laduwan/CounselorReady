<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:image" content="https://counselorready.com/images/og-social.png">
  <meta name="robots" content="noindex,nofollow">
  <title>Forgot Password - CounselorReady</title>
  <link rel="stylesheet" href="/css/design-tokens.css">
  <link rel="stylesheet" href="/css/typography.css">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/js/tailwind-config.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <style>
    body{background:#F8F7F4; font-family: 'Lato', system-ui, sans-serif; }
    .font-display { font-family: 'Cormorant Garamond', Georgia, serif; }
  </style>
<script src="/js/cr-gtag.js"></script>
</head>
<body class="bg-stone-50 min-h-screen flex flex-col">
  
  <!-- Header -->
  <header class="border-b border-hunter-100 bg-white/80 backdrop-blur-sm">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-xl flex items-center justify-center" style="background: linear-gradient(135deg, #8b2542, #6b1d34); shadow-lg shadow-forest-900/20">
          <span class="font-display font-bold text-xl" style="position: relative; display: inline-block; width: 28px; height: 28px;"><span style="color: #D4A855; position: absolute; top: -4px; left: 0;">C</span><span style="color: #4A7C59; position: absolute; top: 6px; left: 8px;">R</span></span>
        </div>
        <div class="flex flex-col">
          <span class="font-display font-semibold text-2xl tracking-wide">
            <span class="text-burgundy-800">Counselor</span><span class="text-hunter-600">Ready</span>
          </span>
        </div>
      </a>
      <a href="/login.html" class="text-forest-700 hover:text-burgundy-700 text-sm font-medium transition-colors">
        Back to Sign In
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      
      <!-- Card -->
      <div class="bg-white rounded-2xl shadow-xl shadow-burgundy-900/10 p-8 border border-burgundy-100">
        
        <!-- Icon -->
        <div class="w-16 h-16 bg-gradient-to-br from-burgundy-800 to-forest-800 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg">
          <svg class="w-8 h-8 text-gold-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
          </svg>
        </div>

        <h1 class="font-display text-3xl font-semibold text-burgundy-900 text-center mb-2">
          Forgot Password?
        </h1>
        <p class="text-forest-600 text-center mb-8">
          No worries! Enter your email and we'll send you a reset link.
        </p>

        <!-- Form -->
        <form id="forgotPasswordForm" class="space-y-6">
          <div>
            <label for="email" class="block text-sm font-medium text-forest-700 mb-2">
              Email Address
            </label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              required
              placeholder="you@example.com"
              class="w-full px-4 py-3 border border-forest-200 rounded-xl focus:ring-2 focus:ring-burgundy-500 focus:border-burgundy-500 transition-all outline-none"
            >
          </div>

          <button 
            type="submit"
            class="w-full bg-gradient-to-r from-burgundy-800 to-burgundy-700 hover:from-burgundy-900 hover:to-burgundy-800 text-white font-semibold py-3 px-4 rounded-xl transition-all shadow-md hover:shadow-lg"
          >
            Send Reset Link
          </button>
        </form>

        <!-- Success Message (hidden by default) -->
        <div id="successMessage" class="hidden">
          <div class="bg-forest-50 border border-forest-200 rounded-xl p-6 text-center">
            <div class="w-12 h-12 bg-forest-500 rounded-full flex items-center justify-center mx-auto mb-4">
              <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
              </svg>
            </div>
            <h3 class="font-display text-xl font-semibold text-forest-800 mb-2">Check Your Email</h3>
            <p class="text-forest-600 text-sm">
              We've sent a password reset link to <span id="sentEmail" class="font-medium"></span>
            </p>
            <p class="text-forest-500 text-sm mt-4">
              Didn't receive it? Check your spam folder or 
              <button onclick="showForm()" class="text-burgundy-700 hover:underline">try again</button>
            </p>
          </div>
        </div>

        <!-- Error Message (hidden by default) -->
        <div id="errorMessage" class="hidden mt-4 bg-red-50 border border-red-200 rounded-xl p-4 text-center">
          <p class="text-red-700 text-sm" id="errorText"></p>
        </div>

      </div>

      <!-- Back to Sign In -->
      <p class="text-center mt-6 text-forest-600">
        Remember your password? 
        <a href="/login.html" class="text-burgundy-700 hover:text-burgundy-800 font-medium">
          Sign in
        </a>
      </p>

    </div>
  </main>

  <!-- Footer -->

  <script>
    const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:5000' : 'https://api.counselorready.com';
    
    const form = document.getElementById('forgotPasswordForm');
    const successMessage = document.getElementById('successMessage');
    const errorMessage = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    const sentEmail = document.getElementById('sentEmail');

    function showForm() {
      form.classList.remove('hidden');
      successMessage.classList.add('hidden');
      errorMessage.classList.add('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const submitBtn = form.querySelector('button[type="submit"]');
      
      // Disable button and show loading
      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <svg class="animate-spin h-5 w-5 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      `;

      try {
        const response = await fetch(`${API_URL}/api/auth/forgot-password`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email }),
        });

        const data = await response.json();

        if (response.ok) {
          // Show success message
          form.classList.add('hidden');
          sentEmail.textContent = email;
          successMessage.classList.remove('hidden');
          errorMessage.classList.add('hidden');
        } else {
          // Show error
          errorText.textContent = data.message || 'Something went wrong. Please try again.';
          errorMessage.classList.remove('hidden');
        }
      } catch (error) {
        // For now, show success anyway (email might have been sent)
        // In production, you might want to show success regardless to prevent email enumeration
        form.classList.add('hidden');
        sentEmail.textContent = email;
        successMessage.classList.remove('hidden');
        errorMessage.classList.add('hidden');
      }

      // Re-enable button
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Send Reset Link';
    });
  </script>

<script src="/shared/nav-footer.js"></script>
<div id="cr-footer"></div>
</body>
</html>
