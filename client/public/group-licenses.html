<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group Licenses | CounselorReady</title>
  <link rel="stylesheet" href="/css/design-tokens.css">
  <link rel="stylesheet" href="/css/typography.css">
  <script src="/js/tailwind-config.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <style>
    body{background:#F8F7F4; font-family: 'Lato', system-ui, sans-serif; }
    .font-display { font-family: 'Cormorant Garamond', Georgia, serif; }
  
    /* Shared nav styles */
    .dd{display:none;position:absolute;top:100%;margin-top:6px;background:#fff;border-radius:10px;box-shadow:0 10px 40px rgba(107,29,52,.12);border:1px solid #FAE8EB;z-index:50;padding:6px 0;min-width:210px}
    .dd.open{display:block}
    .dd a{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:13px;color:#284157;text-decoration:none;transition:background .1s}
    .dd a:hover{background:#F2F7F4}
    .ov{display:none;position:fixed;inset:0;z-index:40}.ov.open{display:block}
    .nav-link{padding:6px 12px;border-radius:6px;font-size:13px;font-weight:500;color:#57534e;text-decoration:none;display:flex;align-items:center;gap:4px;transition:all .15s}
    .nav-link:hover{color:#6B1D34;background:#FDF5F7}
    .nav-link.active{color:#6B1D34;background:#FDF5F7;font-weight:600;border-bottom:2px solid #6B1D34}
  </style>
</head>
<body class="bg-stone-50 min-h-screen">

  <!-- ═══════ HEADER ═══════ -->
  <div id="cr-header"></div>
  <script src="/shared/nav-footer.js"></script>

  <!-- ═══════ MAIN CONTENT ═══════ -->
  <main class="max-w-6xl mx-auto px-6 py-8">

    <!-- Breadcrumb -->
    <a href="/organization.html" class="inline-flex items-center gap-2 text-sm text-gray-500 hover:text-burgundy-700 mb-4">
      <i class="fas fa-chevron-left text-xs"></i> Team
    </a>

    <!-- Page Header -->
    <div class="flex items-start justify-between mb-6">
      <div>
        <h1 class="font-display text-3xl font-semibold text-burgundy-900">Group Licenses</h1>
        <p class="text-gray-500 mt-1">Manage team licenses and seat assignments</p>
      </div>
      <button onclick="showCreate()" class="px-4 py-2 bg-burgundy-700 text-white rounded-lg hover:bg-burgundy-800 transition text-sm font-medium">
        <i class="fas fa-plus mr-1"></i> Create License
      </button>
    </div>

    <!-- Error / Success Messages -->
    <div id="errorMsg" class="hidden bg-red-50 text-red-700 p-3 rounded-lg mb-4 text-sm" role="alert"></div>
    <div id="successMsg" class="hidden bg-green-50 text-green-700 p-3 rounded-lg mb-4 text-sm" role="status"></div>

    <!-- Loading -->
    <div id="loading" class="text-center py-16">
      <div class="animate-spin rounded-full h-10 w-10 border-4 border-burgundy-200 border-t-burgundy-700 mx-auto mb-4"></div>
      <p class="text-gray-500">Loading group licenses...</p>
    </div>

    <!-- Content (hidden until loaded) -->
    <div id="content" class="hidden">

      <!-- Empty State -->
      <div id="emptyState" class="hidden bg-white rounded-xl border border-gray-200 p-12 text-center">
        <i class="fas fa-users text-4xl text-gray-300 mb-4"></i>
        <h3 class="text-lg font-semibold text-gray-900 mb-2">No Group Licenses Found</h3>
        <p class="text-gray-500 mb-4">Create one to manage team subscriptions.</p>
        <button onclick="showCreate()" class="px-6 py-2 bg-burgundy-700 text-white rounded-lg hover:bg-burgundy-800 text-sm font-medium">Get Started</button>
      </div>

      <!-- Licenses Layout -->
      <div id="licensesLayout" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- License Selector (left column) -->
        <div id="licenseSelector" class="space-y-3"></div>

        <!-- Detail Panel (right 2 columns) -->
        <div id="detailPanel" class="lg:col-span-2 space-y-6"></div>
      </div>
    </div>

  </main>

  <!-- ═══════ CREATE LICENSE MODAL ═══════ -->
  <div id="createModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" role="dialog" aria-label="Create group license">
    <div class="bg-white rounded-xl p-6 w-full max-w-md mx-4">
      <h2 class="font-display text-xl font-semibold text-burgundy-900 mb-4">New Group License</h2>
      <form id="createForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Organization Name *</label>
          <input required id="orgName" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-burgundy-300 focus:border-burgundy-500" placeholder="Your organization name">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Plan</label>
            <select id="planSelect" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-burgundy-300">
              <option value="team">Team ($15.99/seat)</option>
              <option value="enterprise">Enterprise (Custom)</option>
              <option value="academic">Academic</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Total Seats *</label>
            <input required type="number" min="5" id="totalSeats" value="10" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-burgundy-300">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Billing Cycle</label>
          <select id="billingCycle" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-burgundy-300">
            <option value="annual">Annual</option>
            <option value="monthly">Monthly</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Contact Email</label>
          <input type="email" id="contactEmail" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-burgundy-300" placeholder="Defaults to your email">
        </div>
        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="hideCreate()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg text-sm">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-burgundy-700 text-white rounded-lg hover:bg-burgundy-800 text-sm font-medium">Create License</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ═══════ INVITE MODAL ═══════ -->
  <div id="inviteModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" role="dialog" aria-label="Invite team members">
    <div class="bg-white rounded-xl p-6 w-full max-w-md mx-4">
      <h2 class="font-display text-xl font-semibold text-burgundy-900 mb-4">Invite Team Members</h2>
      <form id="inviteForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email Addresses (one per line or comma-separated)</label>
          <textarea id="inviteEmails" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-burgundy-300" rows="4" placeholder="colleague@clinic.com&#10;another@practice.com"></textarea>
        </div>
        <div id="availableSeatsInfo" class="text-sm text-gray-500"></div>
        <div class="flex justify-end gap-3">
          <button type="button" onclick="hideInvite()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg text-sm">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-burgundy-700 text-white rounded-lg hover:bg-burgundy-800 text-sm font-medium">Send Invites</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API = location.hostname === 'localhost' ? 'http://localhost:5000' : 'https://api.counselorready.com';
    const T = localStorage.getItem('token');
    if (!T) location.href = '/login.html';

    let licenses = [];
    let selected = null;
    let compliance = null;

    // ── User avatar from JWT ──
    try {
      const p = JSON.parse(atob(T.split('.')[1]));
      document.getElementById('userName').textContent = p.name || '';
      document.getElementById('userAvatar').textContent = (p.name || '--').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
    } catch (e) {}

    // ── Init ──
    document.addEventListener('DOMContentLoaded', init);

    async function init() {
      await fetchLicenses();
    }

    // ── Fetch Licenses ──
    async function fetchLicenses() {
      try {
        const res = await fetch(`${API}/api/group-licenses/my`, {
          headers: { 'Authorization': `Bearer ${T}` }
        });
        if (!res.ok) throw new Error('Failed to load licenses');
        const data = await res.json();
        licenses = Array.isArray(data) ? data : (data.data || []);

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');

        if (licenses.length === 0) {
          document.getElementById('emptyState').classList.remove('hidden');
          document.getElementById('licensesLayout').classList.add('hidden');
        } else {
          document.getElementById('emptyState').classList.add('hidden');
          document.getElementById('licensesLayout').classList.remove('hidden');
          renderSelector();
          selectLicense(licenses[0]);
        }
      } catch (err) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
        document.getElementById('emptyState').classList.remove('hidden');
        showError(err.message || 'Failed to load licenses');
      }
    }

    // ── Fetch Compliance ──
    async function fetchCompliance(id) {
      try {
        const res = await fetch(`${API}/api/group-licenses/${id}/compliance`, {
          headers: { 'Authorization': `Bearer ${T}` }
        });
        if (!res.ok) { compliance = null; return; }
        compliance = await res.json();
      } catch {
        compliance = null;
      }
    }

    // ── Select a License ──
    async function selectLicense(lic) {
      selected = lic;
      renderSelector();
      await fetchCompliance(lic._id);
      renderDetail();
    }

    // ── Render License Selector ──
    function renderSelector() {
      const container = document.getElementById('licenseSelector');
      container.innerHTML = licenses.map((lic, i) => {
        const isActive = selected && selected._id === lic._id;
        const planColors = lic.plan === 'enterprise' ? 'bg-purple-100 text-purple-700'
          : lic.plan === 'academic' ? 'bg-green-100 text-green-700'
          : 'bg-blue-100 text-blue-700';
        return `
        <button onclick="selectLicense(licenses[${i}])" class="w-full text-left p-4 rounded-xl border transition ${isActive ? 'border-burgundy-600 bg-burgundy-50' : 'border-gray-200 bg-white hover:border-gray-300'}">
          <div class="font-semibold text-gray-900">${esc(lic.organizationName)}</div>
          <div class="text-sm text-gray-500 mt-1">${lic.usedSeats || 0}/${lic.totalSeats} seats used</div>
          <span class="mt-2 inline-block text-xs px-2 py-0.5 rounded-full ${planColors}">${esc(lic.plan)}</span>
        </button>`;
      }).join('');
    }

    // ── Render Detail Panel ──
    function renderDetail() {
      if (!selected) return;
      const panel = document.getElementById('detailPanel');

      const usedSeats = selected.usedSeats || 0;
      const totalSeats = selected.totalSeats || 0;
      const availableSeats = selected.availableSeats != null ? selected.availableSeats : (totalSeats - usedSeats);
      const complianceRate = compliance && compliance.complianceRate != null ? Math.round(compliance.complianceRate) : '--';

      // Seat assignments table
      const seats = (selected.seats || []).filter(s => s.status !== 'revoked');
      let seatsHTML = '';
      if (seats.length > 0) {
        seatsHTML = `
        <h3 class="font-display text-lg font-semibold text-burgundy-900 mb-3">Members</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-gray-200">
                <th class="text-left py-2 px-3 text-xs font-bold text-gray-500 uppercase">Name</th>
                <th class="text-left py-2 px-3 text-xs font-bold text-gray-500 uppercase">Email</th>
                <th class="text-left py-2 px-3 text-xs font-bold text-gray-500 uppercase">Status</th>
                <th class="text-left py-2 px-3 text-xs font-bold text-gray-500 uppercase">Assigned</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
              ${seats.map(seat => {
                const name = seat.userId?.profile?.firstName
                  ? (seat.userId.profile.firstName + ' ' + (seat.userId.profile.lastName || '')).trim()
                  : (seat.name || seat.email || '--');
                const statusColors = seat.status === 'active' ? 'bg-green-100 text-green-700'
                  : seat.status === 'suspended' ? 'bg-red-100 text-red-700'
                  : 'bg-yellow-100 text-yellow-700';
                const assignedDate = seat.assignedAt ? new Date(seat.assignedAt).toLocaleDateString() : '--';
                return `<tr class="hover:bg-gray-50">
                  <td class="py-2.5 px-3 font-medium text-gray-900">${esc(name)}</td>
                  <td class="py-2.5 px-3 text-gray-500">${esc(seat.email || '--')}</td>
                  <td class="py-2.5 px-3"><span class="text-xs px-2 py-0.5 rounded-full ${statusColors}">${esc(seat.status)}</span></td>
                  <td class="py-2.5 px-3 text-gray-500">${assignedDate}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>`;
      } else {
        seatsHTML = '<p class="text-sm text-gray-400 italic">No members assigned yet. Invite members to get started.</p>';
      }

      // Compliance section
      let complianceHTML = '';
      if (compliance && compliance.memberProgress && compliance.memberProgress.length > 0) {
        complianceHTML = `
        <div class="bg-white rounded-xl border border-gray-200 p-6">
          <h3 class="font-display text-lg font-semibold text-burgundy-900 mb-4">Compliance Overview</h3>
          <div class="space-y-3">
            ${compliance.memberProgress.map(member => {
              const pct = Math.round(member.overallCompliance || 0);
              const barColor = pct === 100 ? 'bg-green-500' : 'bg-amber-500';
              const textColor = pct === 100 ? 'text-green-600' : 'text-amber-600';
              return `
              <div class="p-3 bg-stone-50 rounded-lg">
                <div class="flex justify-between items-center mb-2">
                  <span class="text-sm font-medium text-gray-900">${esc(member.email || member.name || '--')}</span>
                  <span class="text-xs font-medium ${textColor}">${pct}% complete</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2">
                  <div class="h-2 rounded-full transition-all ${barColor}" style="width:${pct}%"></div>
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }

      panel.innerHTML = `
      <!-- Overview Card -->
      <div class="bg-white rounded-xl border border-gray-200 p-6">
        <div class="flex justify-between items-start mb-4">
          <h2 class="font-display text-xl font-semibold text-burgundy-900">${esc(selected.organizationName)}</h2>
          <button onclick="showInvite()" class="text-sm px-3 py-1.5 bg-burgundy-100 text-burgundy-800 rounded-lg hover:bg-burgundy-200 transition font-medium">
            <i class="fas fa-user-plus mr-1"></i> Invite Members
          </button>
        </div>

        <!-- Stat Cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
          <div class="bg-stone-50 rounded-lg p-4 text-center">
            <div class="text-2xl font-bold text-gray-700">${totalSeats}</div>
            <div class="text-xs text-gray-500 mt-1">Total Seats</div>
          </div>
          <div class="bg-stone-50 rounded-lg p-4 text-center">
            <div class="text-2xl font-bold text-burgundy-700">${usedSeats}</div>
            <div class="text-xs text-gray-500 mt-1">Seats Used</div>
          </div>
          <div class="bg-stone-50 rounded-lg p-4 text-center">
            <div class="text-2xl font-bold text-green-600">${availableSeats}</div>
            <div class="text-xs text-gray-500 mt-1">Seats Available</div>
          </div>
          <div class="bg-stone-50 rounded-lg p-4 text-center">
            <div class="text-2xl font-bold text-hunter-500">${complianceRate}${complianceRate !== '--' ? '%' : ''}</div>
            <div class="text-xs text-gray-500 mt-1">Compliance Rate</div>
          </div>
        </div>

        <!-- Seat Assignments -->
        ${seatsHTML}
      </div>

      <!-- Compliance Breakdown -->
      ${complianceHTML}`;
    }

    // ── Create License ──
    document.getElementById('createForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      hideError();
      const body = {
        organizationName: document.getElementById('orgName').value.trim(),
        totalSeats: Number(document.getElementById('totalSeats').value),
        plan: document.getElementById('planSelect').value,
        billingCycle: document.getElementById('billingCycle').value,
        contactEmail: document.getElementById('contactEmail').value.trim()
      };
      try {
        const res = await fetch(`${API}/api/group-licenses`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${T}`, 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || 'Failed to create license');
        }
        const data = await res.json();
        hideCreate();
        document.getElementById('createForm').reset();
        document.getElementById('totalSeats').value = '10';
        showSuccess('License created successfully');
        await fetchLicenses();
      } catch (err) {
        showError(err.message);
      }
    });

    // ── Invite Members ──
    document.getElementById('inviteForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!selected) return;
      hideError();
      const raw = document.getElementById('inviteEmails').value;
      const emails = raw.split(/[,\n]/).map(e => e.trim()).filter(Boolean);
      if (emails.length === 0) { showError('Please enter at least one email address'); return; }
      try {
        const res = await fetch(`${API}/api/group-licenses/${selected._id}/invite`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${T}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ emails })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || 'Failed to invite members');
        }
        hideInvite();
        document.getElementById('inviteEmails').value = '';
        showSuccess('Invitations sent successfully');
        await fetchLicenses();
      } catch (err) {
        showError(err.message);
      }
    });

    // ── Modal Helpers ──
    function showCreate() {
      document.getElementById('createModal').classList.remove('hidden');
    }
    function hideCreate() {
      document.getElementById('createModal').classList.add('hidden');
    }
    function showInvite() {
      if (selected) {
        const avail = selected.availableSeats != null ? selected.availableSeats : (selected.totalSeats - (selected.usedSeats || 0));
        document.getElementById('availableSeatsInfo').textContent = avail + ' seats available';
      }
      document.getElementById('inviteModal').classList.remove('hidden');
    }
    function hideInvite() {
      document.getElementById('inviteModal').classList.add('hidden');
    }

    // ── Message Helpers ──
    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 6000);
    }
    function hideError() {
      document.getElementById('errorMsg').classList.add('hidden');
    }
    function showSuccess(msg) {
      const el = document.getElementById('successMsg');
      el.textContent = msg;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 4000);
    }

    // ── Escape HTML ──
    function esc(str) {
      if (!str) return '';
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }
  </script>
<script src="/js/cr-icons.js"></script>

  <div id="cr-footer"></div>
</body>
</html>
