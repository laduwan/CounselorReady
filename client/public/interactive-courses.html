<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Courses - CounselorReady</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            burgundy: {
              50: '#fdf5f6', 100: '#fae8eb', 200: '#f5d0d6', 300: '#eba9b5',
              400: '#dd768a', 500: '#c94d65', 600: '#a83350', 700: '#8b2542',
              800: '#6b1d34', 900: '#4a1524', 950: '#2d0a14'
            },
            forest: {
              50: '#f3f6f4', 100: '#e3ebe5', 200: '#c8d7cc', 300: '#a1bba8',
              400: '#759a7f', 500: '#547c5f', 600: '#40634a', 700: '#34503d',
              800: '#2b4133', 900: '#1f3025', 950: '#121c16'
            },
            gold: { 50: '#fefce8', 100: '#fef9c3', 200: '#fef08a', 300: '#fde047', 400: '#facc15', 500: '#d4a012' }
          },
          fontFamily: {
            'display': ['Cormorant Garamond', 'Georgia', 'serif'],
            'body': ['Lato', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Lato:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Lato', system-ui, sans-serif; }
    .font-display { font-family: 'Cormorant Garamond', Georgia, serif; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body class="bg-stone-50 min-h-screen">
  
  <!-- Header -->
  <header class="bg-white border-b border-hunter-100 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center shadow-md" style="background: linear-gradient(135deg, #8b2542, #6b1d34);">
          <span class="font-display font-bold text-lg" style="position: relative; display: inline-block; width: 22px; height: 22px;"><span style="color: #D4A855; position: absolute; top: -3px; left: 0;">C</span><span style="color: #4A7C59; position: absolute; top: 5px; left: 6px;">R</span></span>
        </div>
        <span class="font-display font-semibold text-xl">
          <span class="text-burgundy-800">Counselor</span><span class="text-forest-600">Ready</span>
        </span>
      </a>
      
      <nav class="hidden md:flex items-center gap-8">
        <a href="/dashboard.html" class="text-forest-600 hover:text-forest-700 transition-colors">Dashboard</a>
        <a href="/courses.html" class="text-forest-600 hover:text-forest-700 transition-colors">Courses</a>
        <a href="/credentials.html" class="text-forest-600 hover:text-forest-700 transition-colors">Credentials</a>
        <a href="/certificates.html" class="text-forest-600 hover:text-forest-700 transition-colors">CE Certificates</a>
        <a href="/messages.html" class="text-forest-600 hover:text-forest-700 transition-colors">Messages</a>
      </nav>

      <div class="flex items-center gap-4">
        <a href="/dashboard.html" class="text-forest-600 hover:text-forest-700 text-sm">
          ← Back to Dashboard
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-6 py-8">
    
    <!-- Page Header -->
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="font-display text-3xl font-semibold text-burgundy-900 mb-2">Interactive CE Courses</h1>
        <p class="text-forest-600">Engaging, self-paced continuing education for mental health professionals.</p>
      </div>
      <button onclick="loadCourses()" id="syncBtn" class="inline-flex items-center gap-2 bg-forest-100 hover:bg-forest-200 text-forest-700 font-semibold px-4 py-2 rounded-xl transition-colors">
        <svg id="syncIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        Refresh
      </button>
    </div>

    <!-- Filters & Search -->
    <div class="bg-white rounded-xl border border-burgundy-100 shadow-sm p-6 mb-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- Search -->
        <div class="md:col-span-2">
          <label for="search" class="block text-sm font-medium text-forest-700 mb-2">Search Courses</label>
          <input type="text" id="search" placeholder="Search by title or topic..." onkeyup="filterCourses()" class="w-full px-4 py-3 border border-forest-200 rounded-xl focus:ring-2 focus:ring-burgundy-500 focus:border-burgundy-500 outline-none">
        </div>

        <!-- Filter by Category -->
        <div>
          <label for="filterCategory" class="block text-sm font-medium text-forest-700 mb-2">Category</label>
          <select id="filterCategory" onchange="filterCourses()" class="w-full px-4 py-3 border border-forest-200 rounded-xl focus:ring-2 focus:ring-burgundy-500 focus:border-burgundy-500 outline-none">
            <option value="">All Categories</option>
            <option value="ethics">Ethics</option>
            <option value="clinical">Clinical Skills</option>
            <option value="trauma">Trauma</option>
            <option value="crisis">Crisis Intervention</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Course Grid -->
    <div id="coursesList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Loading State -->
      <div class="md:col-span-3 text-center py-12">
        <div class="inline-block w-8 h-8 border-4 border-burgundy-200 border-t-burgundy-700 rounded-full animate-spin"></div>
        <p class="text-forest-500 mt-4">Loading courses...</p>
      </div>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden bg-white rounded-xl border border-burgundy-100 shadow-sm p-12 text-center">
      <div class="w-20 h-20 bg-forest-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-10 h-10 text-forest-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
        </svg>
      </div>
      <h3 class="font-display text-xl font-semibold text-burgundy-900 mb-2">No courses found</h3>
      <p class="text-forest-600">Try adjusting your filters or check back soon for new courses.</p>
    </div>
  </main>

  <script>
    const API_BASE = 'https://api.counselorready.com/api';
    let allCourses = [];
    
    // Check authentication
    function checkAuth() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/login.html';
        return false;
      }
      return true;
    }

    // Load courses
    async function loadCourses() {
      if (!checkAuth()) return;
      
      const syncIcon = document.getElementById('syncIcon');
      syncIcon?.classList.add('animate-spin');

      try {
        const response = await fetch(`${API_BASE}/interactive-courses`, {
          headers: {
            'Authorization': `Bearer ${localStorage.getItem('token')}`
          }
        });
        
        if (!response.ok) throw new Error('Failed to fetch courses');
        
        const data = await response.json();
        allCourses = data.courses || [];
        renderCourses(allCourses);
      } catch (err) {
        console.error('Error loading courses:', err);
        document.getElementById('coursesList').innerHTML = `
          <div class="md:col-span-3 text-center py-12">
            <p class="text-burgundy-600">Failed to load courses. Please try again.</p>
          </div>
        `;
      } finally {
        setTimeout(() => {
          syncIcon?.classList.remove('animate-spin');
        }, 500);
      }
    }

    // Render courses
    function renderCourses(courses) {
      const container = document.getElementById('coursesList');
      const emptyState = document.getElementById('emptyState');
      
      if (courses.length === 0) {
        container.classList.add('hidden');
        emptyState.classList.remove('hidden');
        return;
      }
      
      container.classList.remove('hidden');
      emptyState.classList.add('hidden');
      
      const html = courses.map(course => {
        const estimatedTime = course.totalEstimatedTime || (course.ceHours * 60) || 60;
        
        return `
          <div class="bg-white rounded-xl border border-burgundy-100 shadow-sm overflow-hidden hover:shadow-lg transition-shadow">>
            <!-- Thumbnail -->
            <div class="h-48 bg-gradient-to-br from-burgundy-100 to-forest-100 flex items-center justify-center">
              ${course.thumbnail ? 
                `<img src="${course.thumbnail}" alt="${course.title}" class="w-full h-full object-cover">` :
                `<svg class="w-16 h-16 text-burgundy-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                </svg>`
              }
            </div>

            <!-- Content -->
            <div class="p-5">
              <!-- Title -->
              <h3 class="font-display text-xl font-semibold text-burgundy-900 mb-2 line-clamp-2">${course.title}</h3>
              
              <!-- Description -->
              <p class="text-forest-500 text-sm mb-4 line-clamp-2">${course.description || ''}</p>

              <!-- Meta Info -->
              <div class="flex flex-wrap items-center gap-2 mb-4">
                <span class="bg-gold-100 text-gold-700 px-2 py-1 rounded-full text-xs font-medium">
                  ${course.ceHours || 1} CE Hours
                </span>
                
                <span class="bg-forest-100 text-forest-700 px-2 py-1 rounded-full text-xs font-medium">
                  ${estimatedTime} min
                </span>
                
                ${course.acepNumber ? `
                  <span class="bg-burgundy-100 text-burgundy-700 px-2 py-1 rounded-full text-xs font-medium">
                    CE #${course.acepNumber}
                  </span>
                ` : ''}
              </div>

              <!-- Categories -->
              ${course.categories && course.categories.length > 0 ? `
                <div class="flex flex-wrap gap-1 mb-4">
                  ${course.categories.slice(0, 2).map(cat => `
                    <span class="px-2 py-0.5 bg-stone-100 text-stone-600 text-xs rounded-full">${cat}</span>
                  `).join('')}
                </div>
              ` : ''}

              <!-- Action Button -->
              <a href="/course-player.html?slug=${course.slug}" class="block w-full text-center bg-burgundy-800 hover:bg-burgundy-900 text-white font-semibold px-4 py-2 rounded-xl transition-colors">
                Start Course
              </a>
            </div>
          </div>
        `;
      }).join('');
      
      container.innerHTML = html;
    }

    // Filter courses
    function filterCourses() {
      const search = document.getElementById('search').value.toLowerCase();
      const category = document.getElementById('filterCategory').value.toLowerCase();
      
      let filtered = allCourses.filter(course => {
        const matchesSearch = !search || 
          course.title?.toLowerCase().includes(search) ||
          course.description?.toLowerCase().includes(search);
        
        const matchesCategory = !category || 
          course.categories?.some(cat => cat.toLowerCase().includes(category));
        
        return matchesSearch && matchesCategory;
      });
      
      renderCourses(filtered);
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', loadCourses);
  </script>

</body>
</html>
